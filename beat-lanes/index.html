<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Beat Lanes</title>
<style>html, body { margin: 0; height: 100%; background: #0c0a18; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../flint/flint.js"></script>
<script>
'use strict';
// Beat Lanes: hit the notes as they cross the line, in time with the music. Built with Flint.
const { Game, Scene, Random, text, store, clamp, damp, NOTE } = Flint;

const W = 360, H = 240, LANES = 4, LW = 42, LX = (W - LANES * LW) / 2, HIT_Y = 206, TRAVEL = 1.5;
const BPM = 112, BEAT = 60 / BPM, STEP = BEAT / 2, BARS = 24, LEAD_IN = 2;
const game = new Game({ canvas: '#game', width: W, height: H, background: '#0c0a18', letterbox: '#0c0a18', touchButtons: [] });
const LANE_KEYS = [['KeyD', 'ArrowLeft', 'PadLeft'], ['KeyF', 'ArrowDown', 'PadDown'], ['KeyJ', 'ArrowUp', 'PadUp'], ['KeyK', 'ArrowRight', 'PadRight']];
LANE_KEYS.forEach((k, i) => game.input.bind('lane' + i, k));
game.input.bind('go', ['Space', 'Enter', 'PadA', 'PadStart']);
const LANE_COLORS = ['#ff5a8a', '#ffd23f', '#4dd9e8', '#9b8cff'];
const KEY_LABELS = ['D', 'F', 'J', 'K'];
const DIFFS = [
  { name: 'EASY', density: 0.35, eighths: 0.1, chords: 0 },
  { name: 'NORMAL', density: 0.55, eighths: 0.35, chords: 0.05 },
  { name: 'HARD', density: 0.75, eighths: 0.7, chords: 0.14 },
];
// A minor: Am F C G, one chord per bar
const CHORDS = [['A2', 'C4', 'E4', 'A4', 'C5'], ['F2', 'A3', 'C4', 'F4', 'A4'], ['C3', 'E4', 'G4', 'C5', 'E5'], ['G2', 'B3', 'D4', 'G4', 'B4']];
const WINDOWS = [{ name: 'PERFECT', t: 0.05, w: 1, pts: 300, color: '#ffe066' }, { name: 'GREAT', t: 0.1, w: 0.75, pts: 200, color: '#8dffa8' }, { name: 'GOOD', t: 0.16, w: 0.5, pts: 100, color: '#4dd9e8' }];

function makeChart(diff) {
  const rng = new Random(1234 + diff * 77), d = DIFFS[diff], notes = [];
  let lane = 1;
  for (let s = 8; s < BARS * 8 - 4; s++) {
    const onBeat = s % 2 === 0, bar = Math.floor(s / 8);
    if (bar % 8 === 7 && s % 8 >= 4) continue; // breathers
    if (!onBeat && rng.next() > d.eighths) continue;
    if (rng.next() > d.density * (onBeat ? 1.25 : 1)) continue;
    lane = clamp(lane + rng.int(-2, 2), 0, LANES - 1);
    if (rng.chance(0.25)) lane = rng.int(0, LANES - 1);
    const t = LEAD_IN + s * STEP;
    notes.push({ t, lane, bar });
    if (rng.next() < d.chords) notes.push({ t, lane: (lane + rng.int(1, 3)) % LANES, bar });
  }
  return notes;
}

class Play extends Scene {
  enter() {
    this.state = 'menu'; this.diff = store.get('beatlanes:diff', 1);
    this.best = store.get('beatlanes:best', {});
    this.flash = [0, 0, 0, 0]; this.pulse = 0;
    this.touchLanes = new Set();
    // multi-touch: each finger presses the lane under it
    const el = this.game.canvas;
    this._down = (e) => { if (this.state !== 'play') return; const p = this.game.toLogical(e.clientX, e.clientY), l = Math.floor((p.x - LX) / LW); if (l >= 0 && l < LANES && p.y > 60) { this.taps.push(l); } };
    el.addEventListener('pointerdown', this._down);
  }
  exit() { this.game.canvas.removeEventListener('pointerdown', this._down); }
  begin() {
    this.notes = makeChart(this.diff).map((n) => Object.assign(n, { done: false }));
    Object.assign(this, { state: 'play', songT: -0.5, score: 0, combo: 0, maxCombo: 0, counts: [0, 0, 0, 0], judge: null, taps: [], scheduled: 0 });
    this.events = this.makeMusic();
    this.audio.sfx('select');
  }
  makeMusic() {
    const ev = [];
    for (let s = 0; s < BARS * 8 + 8; s++) {
      const t = LEAD_IN + s * STEP, bar = Math.floor(s / 8) % 4, chord = CHORDS[bar], b8 = s % 8;
      if (s < 8) { if (s % 2 === 0) ev.push({ t: LEAD_IN - (8 - s) * STEP, kind: 'click', hi: s === 0 }); continue; }
      if (s >= BARS * 8) { if (s === BARS * 8) ev.push({ t, kind: 'end', chord }); continue; }
      if (b8 === 0 || b8 === 4) ev.push({ t, kind: 'kick' });
      if (b8 === 2 || b8 === 6) ev.push({ t, kind: 'snare' });
      ev.push({ t, kind: 'hat', open: b8 % 2 === 1 });
      if (b8 % 2 === 0) ev.push({ t, kind: 'bass', note: chord[0], up: b8 === 4 || b8 === 6 });
      if (b8 === 0) ev.push({ t, kind: 'pad', chord });
    }
    return ev.sort((a, b) => a.t - b.t);
  }
  play(e, delay) {
    const a = this.audio;
    switch (e.kind) {
      case 'click': return a.tone({ freq: e.hi ? 1320 : 880, dur: 0.05, type: 'square', vol: 0.06, delay });
      case 'kick': return a.tone({ freq: 140, to: 45, dur: 0.18, type: 'sine', vol: 0.45, delay });
      case 'snare': return a.noise({ dur: 0.14, vol: 0.18, freq: 2600, to: 900, filter: 'bandpass', delay });
      case 'hat': return a.noise({ dur: e.open ? 0.08 : 0.03, vol: 0.05, freq: 8000, filter: 'highpass', delay });
      case 'bass': return a.tone({ freq: NOTE(e.note) * (e.up ? 2 : 1), dur: STEP * 1.8, type: 'sawtooth', vol: 0.08, delay });
      case 'pad': return e.chord.slice(1, 4).forEach((n) => a.tone({ freq: n, dur: BEAT * 3.6, type: 'triangle', vol: 0.025, attack: 0.15, delay }));
      case 'end': return e.chord.forEach((n, i) => a.tone({ freq: n, dur: 1.6, type: 'triangle', vol: 0.06, delay: delay + i * 0.05 }));
    }
  }
  hit(lane) {
    this.flash[lane] = 1;
    let best = null;
    for (const n of this.notes) {
      if (n.done || n.lane !== lane) continue;
      const dt = Math.abs(n.t - this.songT);
      if (dt <= WINDOWS[2].t && (!best || dt < Math.abs(best.t - this.songT))) best = n;
      if (n.t - this.songT > WINDOWS[2].t) break;
    }
    if (!best) return;
    const off = Math.abs(best.t - this.songT), wi = WINDOWS.findIndex((w) => off <= w.t), w = WINDOWS[wi];
    best.done = true;
    this.counts[wi]++;
    this.combo++; this.maxCombo = Math.max(this.maxCombo, this.combo);
    this.score += Math.round(w.pts * (1 + Math.min(this.combo, 50) / 50));
    this.judge = { text: w.name, color: w.color, t: 0.5 };
    // you play the melody: each hit sounds a chord tone for its lane
    const chord = CHORDS[best.bar % 4];
    this.audio.tone({ freq: NOTE(chord[1 + lane]) * 2, dur: 0.22, type: 'square', vol: 0.06 });
    this.particles.emit(LX + lane * LW + LW / 2, HIT_Y, { count: wi === 0 ? 16 : 9, speed: [30, 90], angle: -Math.PI / 2, spread: 2.6, life: [0.2, 0.45], color: [LANE_COLORS[lane], '#ffffff'], blend: 'lighter', size: [1, 2.5] });
  }
  update(dt) {
    const input = this.input;
    if (input.pressed('KeyM')) this.audio.toggleMute();
    this.flash = this.flash.map((f) => Math.max(0, f - dt * 5));
    this.pulse = Math.max(0, this.pulse - dt * 4);
    if (this.state === 'menu' || this.state === 'results') {
      if (this.state === 'menu') {
        if (input.pressed('left') || input.pressed('lane0')) { this.diff = (this.diff + 2) % 3; this.audio.sfx('blip'); }
        if (input.pressed('right') || input.pressed('lane3')) { this.diff = (this.diff + 1) % 3; this.audio.sfx('blip'); }
        const p = input.pointer;
        if (p.pressed && p.y > 110 && p.y < 140) { const i = Math.floor((p.x - (W / 2 - 105)) / 70); if (i >= 0 && i < 3) { if (i === this.diff) this.startSoon = true; this.diff = i; this.audio.sfx('blip'); } }
        if (p.pressed && p.y > 160 && p.y < 190) this.startSoon = true;
      } else if (input.pointer.pressed && this.time - this.doneAt > 1) this.startSoon = true;
      if ((input.pressed('go') || this.startSoon) && this.time > 0.4 && (this.state === 'menu' || this.time - this.doneAt > 1)) {
        this.startSoon = false;
        if (this.state === 'results') { this.state = 'menu'; return; }
        store.set('beatlanes:diff', this.diff);
        this.begin();
      }
      this.startSoon = false;
      return;
    }
    // play
    this.songT += dt;
    while (this.scheduled < this.events.length && this.events[this.scheduled].t < this.songT + 0.12) {
      const e = this.events[this.scheduled++];
      this.play(e, Math.max(0, e.t - this.songT));
      if (e.kind === 'kick') this.timers.after(Math.max(0, e.t - this.songT), () => (this.pulse = 1));
    }
    for (let i = 0; i < LANES; i++) if (input.pressed('lane' + i)) this.hit(i);
    for (const l of this.taps) this.hit(l);
    this.taps = [];
    for (const n of this.notes) {
      if (!n.done && this.songT - n.t > WINDOWS[2].t) {
        n.done = true; n.missed = true; this.counts[3]++; this.combo = 0;
        this.judge = { text: 'MISS', color: '#ff5a5a', t: 0.5 };
      }
    }
    if (this.judge) { this.judge.t -= dt; if (this.judge.t <= 0) this.judge = null; }
    if (input.pressed('Escape')) { this.state = 'menu'; return; }
    if (this.songT > LEAD_IN + BARS * 8 * STEP + 1.5) this.finish();
  }
  finish() {
    const total = this.notes.length, acc = total ? (this.counts[0] + this.counts[1] * 0.75 + this.counts[2] * 0.5) / total : 0;
    this.acc = acc;
    this.grade = acc >= 0.95 ? 'S' : acc >= 0.9 ? 'A' : acc >= 0.8 ? 'B' : acc >= 0.7 ? 'C' : 'D';
    const key = DIFFS[this.diff].name;
    this.newBest = !this.best[key] || this.score > this.best[key];
    if (this.newBest) { this.best[key] = this.score; store.set('beatlanes:best', this.best); }
    this.state = 'results'; this.doneAt = this.time;
    this.audio.sfx(acc >= 0.8 ? 'win' : 'powerup');
  }
  blur() { if (this.state === 'play') this.state = 'menu'; }
  drawBackground(ctx) {
    ctx.fillStyle = '#0c0a18'; ctx.fillRect(0, 0, W, H);
    const k = this.pulse;
    ctx.fillStyle = `rgba(122,44,255,${0.06 + k * 0.08})`;
    for (let i = 0; i < 6; i++) ctx.fillRect(0, H - (i + 1) * 30 - k * 6, W, 1);
    for (let i = 0; i < LANES; i++) {
      const x = LX + i * LW;
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.055)'; ctx.fillRect(x, 0, LW, H);
      if (this.flash[i] > 0) { const g = ctx.createLinearGradient(0, HIT_Y, 0, 60); g.addColorStop(0, hexA(LANE_COLORS[i], 0.35 * this.flash[i])); g.addColorStop(1, hexA(LANE_COLORS[i], 0)); ctx.fillStyle = g; ctx.fillRect(x, 60, LW, HIT_Y - 60); }
    }
  }
  drawWorld(ctx) {
    if (this.state !== 'play' && this.state !== 'results') return;
    // hit line and lane buttons
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(LX, HIT_Y - 1, LANES * LW, 2);
    for (let i = 0; i < LANES; i++) {
      const x = LX + i * LW + LW / 2, on = this.flash[i];
      ctx.strokeStyle = LANE_COLORS[i]; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 + on * 0.5;
      ctx.beginPath(); ctx.arc(x, HIT_Y, 11 + on * 2, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
      text(ctx, KEY_LABELS[i], x, HIT_Y + 18, { size: 8, align: 'center', color: 'rgba(255,255,255,.45)', weight: '700' });
    }
    if (!this.notes) return;
    for (const n of this.notes) {
      if (n.done && !n.missed) continue;
      const y = HIT_Y - ((n.t - this.songT) / TRAVEL) * (HIT_Y + 10);
      if (y < -12 || y > H + 12) continue;
      const x = LX + n.lane * LW + 4, c = LANE_COLORS[n.lane];
      ctx.globalAlpha = n.missed ? 0.25 : 1;
      ctx.save(); ctx.shadowColor = c; ctx.shadowBlur = n.missed ? 0 : 10;
      ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y - 5, LW - 8, 10, 4); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x + 4, y - 3, LW - 16, 2);
      ctx.globalAlpha = 1;
    }
  }
  drawUI(ctx) {
    const t = (s, x, y, o) => text(ctx, s, x, y, Object.assign({ size: 8, color: '#efeaff', weight: '700', font: 'system-ui, -apple-system, "Segoe UI", sans-serif' }, o));
    if (this.state === 'menu') {
      t('BEAT LANES', W / 2, 30, { size: 28, align: 'center', weight: '900', color: '#ffe066' });
      t('hit each note as it crosses the line, in time with the beat', W / 2, 70, { size: 8, align: 'center', weight: '500' });
      t('keys D F J K (or ← ↓ ↑ →) · tap the lanes on touch screens', W / 2, 84, { size: 7, align: 'center', weight: '500', color: '#a99fd0' });
      DIFFS.forEach((d, i) => {
        const x = W / 2 - 105 + i * 70, on = i === this.diff;
        ctx.fillStyle = on ? '#ffe066' : 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.roundRect(x + 3, 112, 64, 26, 6); ctx.fill();
        t(d.name, x + 35, 117, { size: 9, align: 'center', color: on ? '#0c0a18' : '#efeaff' });
        const b = this.best[d.name]; if (b) t(`best ${b}`, x + 35, 128, { size: 6, align: 'center', weight: '500', color: on ? '#0c0a18' : '#a99fd0' });
      });
      t('← → pick a level', W / 2, 146, { size: 7, align: 'center', weight: '500', color: '#a99fd0' });
      if (Math.floor(this.time * 2) % 2 === 0) t('press Space or tap here to play', W / 2, 168, { size: 10, align: 'center', color: '#ffe066' });
      t('tip: headphones help · M mutes · Esc quits a song', W / 2, 220, { size: 6, align: 'center', weight: '500', color: '#6f6699' });
      return;
    }
    t(String(this.score).padStart(7, '0'), 10, 8, { size: 10 });
    if (this.combo >= 3) t(`${this.combo} COMBO`, W - 10, 8, { size: 10, align: 'right', color: '#ffe066' });
    const total = this.notes.length, done = this.notes.filter((n) => n.done).length;
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(LX, 24, LANES * LW, 3);
    ctx.fillStyle = '#9b8cff'; ctx.fillRect(LX, 24, LANES * LW * (done / total), 3);
    if (this.songT < LEAD_IN) t(this.songT < LEAD_IN - 1 ? 'GET READY' : 'GO!', W / 2, 100, { size: 16, align: 'center', color: '#ffe066' });
    if (this.judge) t(this.judge.text, W / 2, 150, { size: 12, align: 'center', color: this.judge.color, alpha: Math.min(1, this.judge.t * 3) });
    if (this.state === 'results') {
      ctx.fillStyle = 'rgba(12,10,24,.88)'; ctx.fillRect(0, 0, W, H);
      t(`${DIFFS[this.diff].name} CLEAR`, W / 2, 24, { size: 12, align: 'center', color: '#a99fd0' });
      t(this.grade, W / 2, 42, { size: 48, align: 'center', weight: '900', color: this.grade === 'S' ? '#ffe066' : '#efeaff' });
      t(`${this.score}${this.newBest ? '  · new best!' : ''}`, W / 2, 100, { size: 14, align: 'center' });
      t(`accuracy ${(this.acc * 100).toFixed(1)}%   max combo ${this.maxCombo}`, W / 2, 122, { size: 9, align: 'center', weight: '500' });
      const rows = [['PERFECT', this.counts[0], '#ffe066'], ['GREAT', this.counts[1], '#8dffa8'], ['GOOD', this.counts[2], '#4dd9e8'], ['MISS', this.counts[3], '#ff5a5a']];
      rows.forEach(([n, c, col], i) => { t(n, W / 2 - 50, 142 + i * 13, { size: 8, color: col }); t(String(c), W / 2 + 50, 142 + i * 13, { size: 8, align: 'right' }); });
      if (this.time - this.doneAt > 1) t('Space or tap to continue', W / 2, 206, { size: 9, align: 'center', color: '#ffe066' });
    }
  }
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }

game.start(new Play());
window.beatLanes = game;
</script>
</body>
</html>
