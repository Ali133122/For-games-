<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lantern Drift</title>
<style>
  :root { --bg: #07060b; --ink: #f4e6c8; --dim: #8a7f6c; --accent: #ffb347; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; touch-action: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between;
    font-size: 15px; letter-spacing: .04em; pointer-events: none; text-shadow: 0 0 8px #000; }
  #hud b { color: var(--accent); font-weight: 600; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 14px; padding: 16px; background: rgba(7,6,11,.72); }
  #overlay h1 { font-size: clamp(36px, 9vw, 72px); font-weight: 300; letter-spacing: .12em; color: var(--accent);
    text-shadow: 0 0 24px rgba(255,179,71,.6); }
  #overlay p { max-width: 460px; color: var(--dim); line-height: 1.55; font-size: 15px; }
  #overlay p strong { color: var(--ink); font-weight: 500; }
  #overlay button { margin-top: 8px; padding: 12px 32px; font: inherit; font-size: 17px; letter-spacing: .1em;
    color: var(--bg); background: var(--accent); border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 0 24px rgba(255,179,71,.45); }
  #overlay button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #flareBtn { position: fixed; right: 20px; bottom: 24px; width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid var(--accent); background: rgba(255,179,71,.12); color: var(--accent); font: inherit;
    font-size: 13px; letter-spacing: .1em; display: none; }
  #mute { pointer-events: auto; background: none; border: 0; color: var(--dim); font: inherit; font-size: 15px;
    cursor: pointer; padding: 0 0 0 14px; letter-spacing: .04em; }
  #mute:hover { color: var(--ink); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span>Embers <b id="score">0</b></span><span>Best <b id="best">0</b><button id="mute" aria-label="Toggle sound">Sound on</button></span></div>
<button id="flareBtn" aria-label="Flare">FLARE</button>
<div id="overlay">
  <h1>LANTERN DRIFT</h1>
  <p id="msg">Your lantern is going out. Gather <strong>embers</strong> to keep it burning.
    <strong>Wraiths</strong> creep in from the dark, and each touch drains your light.<br><br>
    <strong>Move:</strong> WASD / arrow keys / mouse, or drag on touch screens<br>
    <strong>Flare:</strong> Space or click. Spend light to burn away nearby wraiths.<br>
    <strong>Sound:</strong> M to mute</p>
  <button id="start">BEGIN</button>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), msg = $('msg'), startBtn = $('start'), flareBtn = $('flareBtn');
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  let best = 0;
  try { best = +localStorage.getItem('lanternDriftBest') || 0; } catch (e) {}
  $('best').textContent = best;

  // ---------- Sound (synthesized with Web Audio, no files) ----------
  let AC = null, master = null, droneGain = null, muted = false, heartT = 0;
  try { muted = localStorage.getItem('lanternDriftMuted') === '1'; } catch (e) {}
  const muteBtn = $('mute');
  const showMute = () => { muteBtn.textContent = muted ? 'Sound off' : 'Sound on'; };
  showMute();
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : .55; master.connect(AC.destination);
      // low ambient drone: two detuned oscillators through a lowpass
      droneGain = AC.createGain(); droneGain.gain.value = 0;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
      [55, 55.6, 82.4].forEach((f, i) => {
        const o = AC.createOscillator(); o.type = i === 2 ? 'sine' : 'sawtooth'; o.frequency.value = f;
        const g = AC.createGain(); g.gain.value = i === 2 ? .5 : .35;
        o.connect(g).connect(lp); o.start();
      });
      lp.connect(droneGain).connect(master);
    } catch (e) { AC = null; }
  }
  function setMuted(m) {
    muted = m; showMute();
    try { localStorage.setItem('lanternDriftMuted', m ? '1' : '0'); } catch (e) {}
    if (master) master.gain.setTargetAtTime(m ? 0 : .55, AC.currentTime, .05);
  }
  function setDrone(level) {
    if (droneGain) droneGain.gain.setTargetAtTime(level, AC.currentTime, .4);
  }
  function tone(freq, dur, { type = 'sine', vol = .3, to = null, delay = 0, attack = .005 } = {}) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
  }
  let noiseBuf = null;
  function noise(dur, { vol = .3, from = 800, to = 800, type = 'lowpass', delay = 0 } = {}) {
    if (!AC || muted) return;
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = AC.currentTime + delay, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = noiseBuf; f.type = type; f.Q.value = 1.2;
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + dur + .05);
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  const SFX = {
    start() { [0, 4, 7, 12].forEach((n, i) => tone(330 * 2 ** (n / 12), .5, { type: 'triangle', vol: .18, delay: i * .09 })); },
    ember(n) {
      const f = 523 * 2 ** (PENTA[n % PENTA.length] / 12);
      tone(f, .35, { vol: .2 }); tone(f * 2, .25, { vol: .07, delay: .03 });
    },
    flare() {
      noise(.55, { vol: .45, from: 300, to: 5000, type: 'bandpass' });
      tone(110, .4, { type: 'sine', vol: .45, to: 40 });
    },
    banish(i) { tone(700 - i * 30, .35, { type: 'triangle', vol: .12, to: 180, delay: .05 + i * .04 }); },
    hurt() {
      tone(160, .45, { type: 'sawtooth', vol: .22, to: 50 });
      noise(.3, { vol: .3, from: 1200, to: 200 });
    },
    heart() { tone(70, .15, { vol: .35, to: 45 }); tone(65, .15, { vol: .25, to: 40, delay: .16 }); },
    over() { [12, 7, 3, 0].forEach((n, i) => tone(220 * 2 ** (n / 12), .7, { type: 'triangle', vol: .16, delay: i * .22 })); },
  };

  const MAX_LIGHT = 100;
  let state = 'menu', player, embers, wraiths, particles, score, time, spawnT, shake;
  const keys = {};
  let pointer = null, touching = false;

  function reset() {
    player = { x: W / 2, y: H / 2, vx: 0, vy: 0, light: MAX_LIGHT, hurt: 0, flareCd: 0 };
    embers = []; wraiths = []; particles = [];
    score = 0; time = 0; spawnT = 1.5; shake = 0;
    for (let i = 0; i < 5; i++) spawnEmber();
    $('score').textContent = 0;
  }
  const rand = (a, b) => a + Math.random() * (b - a);
  const radius = () => 40 + player.light * 1.6;

  function spawnEmber() {
    embers.push({ x: rand(40, W - 40), y: rand(60, H - 40), t: rand(0, 6.28) });
  }
  function spawnWraith() {
    const side = Math.floor(Math.random() * 4), m = 40;
    const x = side === 0 ? -m : side === 1 ? W + m : rand(0, W);
    const y = side === 2 ? -m : side === 3 ? H + m : rand(0, H);
    const speed = rand(38, 58) + Math.min(time * 1.2, 70);
    wraiths.push({ x, y, speed, wob: rand(0, 6.28), r: rand(13, 19) });
  }
  function burst(x, y, n, color, spd) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, 6.28), s = rand(spd * .3, spd);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.4, .9), max: .9, color });
    }
  }
  function flare() {
    if (state !== 'play' || player.flareCd > 0 || player.light < 18) return;
    player.light -= 15; player.flareCd = .6; shake = 8;
    const R = radius() * 1.5;
    burst(player.x, player.y, 60, '255,200,110', 420);
    SFX.flare();
    let killed = 0;
    wraiths = wraiths.filter(w => {
      if (Math.hypot(w.x - player.x, w.y - player.y) < R) {
        burst(w.x, w.y, 18, '170,140,255', 160); score += 1; SFX.banish(killed++); return false;
      }
      return true;
    });
    $('score').textContent = score;
    flareRing = { r: 0, max: R, life: .35 };
  }
  let flareRing = null;

  function update(dt) {
    time += dt;
    // input
    let ax = 0, ay = 0;
    if (keys.ArrowLeft || keys.KeyA) ax -= 1;
    if (keys.ArrowRight || keys.KeyD) ax += 1;
    if (keys.ArrowUp || keys.KeyW) ay -= 1;
    if (keys.ArrowDown || keys.KeyS) ay += 1;
    if (!ax && !ay && pointer) {
      const dx = pointer.x - player.x, dy = pointer.y - player.y, d = Math.hypot(dx, dy);
      if (d > 8) { ax = dx / d * Math.min(1, d / 80); ay = dy / d * Math.min(1, d / 80); }
    }
    const al = Math.hypot(ax, ay); if (al > 1) { ax /= al; ay /= al; }
    const ACC = 1500, FRICTION = 6;
    player.vx += ax * ACC * dt; player.vy += ay * ACC * dt;
    player.vx -= player.vx * FRICTION * dt; player.vy -= player.vy * FRICTION * dt;
    player.x = Math.max(12, Math.min(W - 12, player.x + player.vx * dt));
    player.y = Math.max(12, Math.min(H - 12, player.y + player.vy * dt));

    // light decays faster over time
    player.light -= (3.2 + time * 0.035) * dt;
    player.hurt = Math.max(0, player.hurt - dt);
    player.flareCd = Math.max(0, player.flareCd - dt);
    shake = Math.max(0, shake - dt * 30);

    // embers
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i]; e.t += dt * 3;
      if (Math.hypot(e.x - player.x, e.y - player.y) < 22) {
        embers.splice(i, 1); score++; player.light = Math.min(MAX_LIGHT, player.light + 14);
        burst(e.x, e.y, 14, '255,180,80', 140); spawnEmber(); SFX.ember(score);
        $('score').textContent = score;
      }
    }

    // wraiths
    spawnT -= dt;
    if (spawnT <= 0) { spawnWraith(); spawnT = Math.max(.45, 2.2 - time * 0.025); }
    const R = radius();
    for (let i = wraiths.length - 1; i >= 0; i--) {
      const w = wraiths[i]; w.wob += dt * 4;
      const dx = player.x - w.x, dy = player.y - w.y, d = Math.hypot(dx, dy) || 1;
      // wraiths slow down inside bright light
      const slow = d < R * .55 ? .55 : 1;
      w.x += (dx / d * w.speed * slow + Math.cos(w.wob) * 30) * dt;
      w.y += (dy / d * w.speed * slow + Math.sin(w.wob * 1.3) * 30) * dt;
      if (d < w.r + 10 && player.hurt <= 0) {
        player.light -= 22; player.hurt = .8; shake = 12;
        burst(player.x, player.y, 24, '140,110,220', 220); SFX.hurt();
        wraiths.splice(i, 1);
      }
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (flareRing) { flareRing.life -= dt; flareRing.r += (flareRing.max - flareRing.r) * 14 * dt;
      if (flareRing.life <= 0) flareRing = null; }

    // heartbeat when the light is nearly out
    heartT -= dt;
    if (player.light < 25 && heartT <= 0) { SFX.heart(); heartT = .5 + player.light / 25 * .6; }
    setDrone(.05 + (1 - Math.max(0, player.light) / MAX_LIGHT) * .09);

    if (player.light <= 0) gameOver();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    ctx.fillStyle = '#07060b'; ctx.fillRect(-20, -20, W + 40, H + 40);
    if (!player) { ctx.restore(); return; }
    const R = radius(), flick = 1 + Math.sin(time * 17) * .015 + Math.sin(time * 7.3) * .02;

    // warm ground glow
    const g = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, R * flick);
    g.addColorStop(0, 'rgba(255,190,110,.42)'); g.addColorStop(.5, 'rgba(200,110,50,.16)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // embers (faintly visible everywhere so you can navigate)
    for (const e of embers) {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      const vis = Math.max(.28, 1 - d / (R * 1.4));
      const s = 5 + Math.sin(e.t) * 1.5;
      const eg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, s * 4);
      eg.addColorStop(0, `rgba(255,200,100,${vis})`); eg.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(e.x, e.y, s * 4, 0, 6.28); ctx.fill();
      ctx.fillStyle = `rgba(255,240,200,${vis})`; ctx.beginPath(); ctx.arc(e.x, e.y, s * .55, 0, 6.28); ctx.fill();
    }

    // wraiths, only visible inside the light, plus glinting eyes just beyond it
    for (const w of wraiths) {
      const d = Math.hypot(w.x - player.x, w.y - player.y);
      const vis = Math.max(0, Math.min(1, (R * 1.05 - d) / (R * .4)));
      if (vis > 0) {
        ctx.fillStyle = `rgba(60,40,110,${.75 * vis})`;
        ctx.beginPath();
        ctx.ellipse(w.x, w.y, w.r, w.r * 1.2 + Math.sin(w.wob) * 2, 0, Math.PI, 0);
        for (let k = 0; k <= 4; k++) {
          const tx = w.x + w.r - (k / 4) * w.r * 2;
          ctx.lineTo(tx, w.y + w.r * 1.1 + (k % 2 ? -5 : 4) + Math.sin(w.wob + k) * 3);
        }
        ctx.closePath(); ctx.fill();
      }
      const eyeA = Math.max(vis, d < R * 2 ? .35 : 0);
      if (eyeA > 0) {
        ctx.fillStyle = `rgba(190,170,255,${eyeA})`;
        ctx.beginPath(); ctx.arc(w.x - w.r * .35, w.y - 2, 2.2, 0, 6.28);
        ctx.arc(w.x + w.r * .35, w.y - 2, 2.2, 0, 6.28); ctx.fill();
      }
    }

    // particles
    for (const p of particles) {
      ctx.fillStyle = `rgba(${p.color},${Math.max(0, p.life / p.max)})`;
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    if (flareRing) {
      ctx.strokeStyle = `rgba(255,210,140,${flareRing.life / .35})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(player.x, player.y, flareRing.r, 0, 6.28); ctx.stroke();
    }

    // lantern
    const blink = player.hurt > 0 && Math.floor(player.hurt * 20) % 2;
    if (!blink) {
      const lg = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, 26);
      lg.addColorStop(0, 'rgba(255,245,215,1)'); lg.addColorStop(.35, 'rgba(255,190,90,.8)');
      lg.addColorStop(1, 'rgba(255,140,40,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(player.x, player.y, 26, 0, 6.28); ctx.fill();
      ctx.strokeStyle = 'rgba(80,55,30,.9)'; ctx.lineWidth = 2;
      ctx.strokeRect(player.x - 7, player.y - 9, 14, 18);
      ctx.beginPath(); ctx.arc(player.x, player.y - 12, 5, Math.PI, 0); ctx.stroke();
    }
    ctx.restore();

    // light meter
    const mw = Math.min(260, W - 32), mx = (W - mw) / 2, my = H - 22;
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(mx, my, mw, 6);
    const pct = Math.max(0, player.light) / MAX_LIGHT;
    ctx.fillStyle = pct < .25 ? '#ff6b4a' : '#ffb347';
    ctx.fillRect(mx, my, mw * pct, 6);
    if (player.light >= 18 && player.flareCd <= 0) {
      ctx.fillStyle = 'rgba(244,230,200,.55)'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('FLARE READY', W / 2, my - 6);
    }
  }

  function gameOver() {
    state = 'over';
    SFX.over(); setDrone(0);
    const newBest = score > best;
    if (newBest) { best = score; try { localStorage.setItem('lanternDriftBest', best); } catch (e) {} }
    $('best').textContent = best;
    overlay.querySelector('h1').textContent = 'THE LIGHT FADES';
    msg.innerHTML = `You gathered <strong>${score}</strong> embers and lasted <strong>${time.toFixed(1)}s</strong>.` +
      (newBest ? '<br><strong>New best!</strong>' : '');
    startBtn.textContent = 'AGAIN';
    overlay.classList.remove('hidden');
    flareBtn.style.display = 'none';
    startBtn.focus();
  }
  function start() {
    initAudio(); reset(); state = 'play'; overlay.classList.add('hidden'); SFX.start(); heartT = 0;
    if (matchMedia('(pointer: coarse)').matches) flareBtn.style.display = 'block';
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // input
  startBtn.addEventListener('click', start);
  muteBtn.addEventListener('click', () => { initAudio(); setMuted(!muted); muteBtn.blur(); });
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); if (state === 'play') flare(); }
    if (e.code === 'Enter' && state !== 'play') start();
    if (e.code === 'KeyM' && !e.repeat) setMuted(!muted);
    if (e.code.startsWith('Arrow')) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  cv.addEventListener('mousemove', e => { pointer = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('mouseleave', () => { pointer = null; });
  cv.addEventListener('mousedown', e => { if (e.button === 0) flare(); });
  const tp = t => ({ x: t.clientX, y: t.clientY - 50 }); // offset so finger doesn't hide the lantern
  cv.addEventListener('touchstart', e => { e.preventDefault(); pointer = tp(e.touches[0]); }, { passive: false });
  cv.addEventListener('touchmove', e => { e.preventDefault(); pointer = tp(e.touches[0]); }, { passive: false });
  cv.addEventListener('touchend', e => { if (!e.touches.length) pointer = null; });
  flareBtn.addEventListener('touchstart', e => { e.preventDefault(); flare(); }, { passive: false });
  flareBtn.addEventListener('click', flare);
})();
</script>
</body>
</html>
