<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Deep Cast</title>
<style>html, body { margin: 0; height: 100%; background: #0d2a3a; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../flint/flint.js"></script>
<script>
'use strict';
// Deep Cast: cast, hook and reel in fish before the day ends. Built with Flint.
const { Game, Scene, text, store, rand, chance, pick, clamp, damp, lerp } = Flint;

const W = 360, H = 240, SURF = 70, FLOOR = 228, TIP = { x: 62, y: 44 }, DAY = 150;
const game = new Game({ canvas: '#game', width: W, height: H, background: '#0d2a3a', letterbox: '#0d2a3a', touchButtons: [] });
game.input.bind('reel', ['Space', 'Enter', 'PadA', 'Pointer', 'ArrowDown', 'KeyS']);

const SPECIES = [
  { name: 'Minnow', depth: [80, 120], size: 7, kg: [0.1, 0.3], pts: 10, str: 0.45, speed: 30, color: '#c8d8e8', weight: 10 },
  { name: 'Perch', depth: [100, 165], size: 11, kg: [0.3, 1.1], pts: 30, str: 0.75, speed: 24, color: '#e0c050', stripes: true, weight: 7 },
  { name: 'Bass', depth: [130, 200], size: 15, kg: [1, 3.2], pts: 60, str: 1.05, speed: 20, color: '#5a9a5a', weight: 5 },
  { name: 'Pike', depth: [150, 214], size: 21, kg: [2, 6.5], pts: 120, str: 1.4, speed: 26, color: '#86a06a', long: true, weight: 2.5 },
  { name: 'Golden Koi', depth: [180, 218], size: 14, kg: [1, 2.4], pts: 300, str: 1.25, speed: 18, color: '#ffb020', weight: 0.6 },
  { name: 'Old Boot', depth: [220, 224], size: 8, kg: [0.6, 0.9], pts: 1, str: 0.3, speed: 0, color: '#5a4636', junk: true, weight: 0.8 },
];

class Play extends Scene {
  enter() {
    this.state = 'title';
    this.journal = store.get('deepcast:journal', {});
    this.best = store.get('deepcast:best', 0);
    this.fish = []; this.bubbles = [];
    for (let i = 0; i < 7; i++) this.spawnFish(true);
    this.reset();
  }
  reset() { Object.assign(this, { mode: 'ready', power: 0, lure: null, hooked: null, tension: 0, slack: 0, msg: null, card: null }); }
  begin() { this.score = 0; this.clock = DAY; this.catches = []; this.reset(); this.state = 'play'; this.audio.sfx('select'); }
  spawnFish(anywhere) {
    const total = SPECIES.reduce((a, s) => a + s.weight, 0);
    let r = Math.random() * total, sp = SPECIES[0];
    for (const s of SPECIES) if ((r -= s.weight) <= 0) { sp = s; break; }
    const dir = chance(0.5) ? 1 : -1;
    this.fish.push({ sp, x: anywhere ? rand(90, W - 10) : dir > 0 ? -20 : W + 20, y: rand(...sp.depth), dir, kg: +rand(...sp.kg).toFixed(2), wob: rand(0, 6), interest: 0, cool: 0 });
  }
  update(dt) {
    const input = this.input, hold = input.down('reel'), press = input.pressed('reel');
    if (input.pressed('KeyM')) this.audio.toggleMute();
    if (this.msg) { this.msg.t -= dt; if (this.msg.t <= 0) this.msg = null; }
    if (Math.random() < dt * 3) this.bubbles.push({ x: rand(0, W), y: FLOOR, r: rand(0.6, 1.6) });
    for (const b of this.bubbles) { b.y -= 14 * dt; b.x += Math.sin(b.y * 0.1) * 0.2; }
    this.bubbles = this.bubbles.filter((b) => b.y > SURF);
    this.moveFish(dt);
    if (this.state !== 'play') {
      if (this.time > 0.5 && press && (this.state === 'title' || this.time - this.overAt > 1.2)) this.begin();
      return;
    }
    this.clock -= dt;
    if (this.clock <= 0 && this.mode !== 'fight') return this.endDay();

    switch (this.mode) {
      case 'ready':
        if (press) { this.mode = 'charge'; this.power = 0; this.chargeT = 0; }
        break;
      case 'charge':
        this.chargeT += dt; this.power = 1 - Math.abs(((this.chargeT * 0.8) % 2) - 1);
        if (!hold) {
          const tx = 90 + this.power * 255;
          this.lure = { x: TIP.x, y: TIP.y, vx: (tx - TIP.x) / 0.8, vy: -95, inWater: false };
          this.mode = 'fly';
          this.audio.noise({ dur: 0.25, vol: 0.1, freq: 2500, to: 600, filter: 'bandpass' });
        }
        break;
      case 'fly': {
        const l = this.lure;
        l.vy += 240 * dt; l.x += l.vx * dt; l.y += l.vy * dt;
        if (l.y >= SURF) {
          l.y = SURF; l.inWater = true; this.mode = 'sink';
          this.audio.noise({ dur: 0.2, vol: 0.18, freq: 900 });
          this.particles.emit(l.x, SURF, { count: 12, speed: [20, 60], angle: -Math.PI / 2, spread: 1.6, life: [0.3, 0.6], color: '#cfeaff', gravity: 200 });
        }
        break;
      }
      case 'sink': {
        const l = this.lure;
        if (hold) {
          const dx = TIP.x + 8 - l.x, dy = SURF - 2 - l.y, d = Math.hypot(dx, dy);
          if (d < 8 || l.x < TIP.x + 14) { this.reset(); break; }
          l.x += (dx / d) * 48 * dt; l.y += (dy / d) * 22 * dt; l.y = Math.max(SURF + 1, l.y);
        } else l.y = Math.min(FLOOR - 3, l.y + 22 * dt);
        l.x = Math.max(TIP.x + 10, l.x);
        break;
      }
      case 'bite':
        this.biteT -= dt;
        if (press) {
          this.mode = 'fight'; this.tension = 0.45; this.slack = 0;
          this.msg = { text: 'HOOKED! keep the needle in the green', t: 1.4 };
          this.audio.tone({ freq: 880, dur: 0.1, type: 'square', vol: 0.1 });
        } else if (this.biteT <= 0) {
          this.hooked.cool = 4; this.hooked.interest = 0; this.hooked = null; this.mode = 'sink';
          this.msg = { text: 'too slow, it got away', t: 1.2 };
        }
        break;
      case 'fight': this.fight(dt, hold); break;
      case 'landed':
        this.cardT -= dt;
        if (this.cardT <= 0 || (press && this.cardT < 1.2)) { this.reset(); if (this.clock <= 0) this.endDay(); }
        break;
    }
  }
  moveFish(dt) {
    const l = this.lure, hunting = this.state === 'play' && l && l.inWater && this.mode === 'sink';
    for (const f of this.fish) {
      if (f === this.hooked) continue;
      f.wob += dt * 4; f.cool = Math.max(0, f.cool - dt);
      if (f.sp.junk) {
        if (hunting && Math.hypot(l.x - f.x, l.y - f.y) < 7 && !this.hooked) this.bite(f);
        continue;
      }
      const d = hunting ? Math.hypot(l.x - f.x, l.y - f.y) : 1e9;
      if (hunting && d < 55 && f.cool <= 0 && !this.hooked) f.interest = Math.min(1, f.interest + dt * 0.5);
      else f.interest = Math.max(0, f.interest - dt);
      if (f.interest > 0.5) {
        f.dir = l.x > f.x ? 1 : -1;
        f.x += ((l.x - f.x) / Math.max(d, 1)) * f.sp.speed * 0.9 * dt; f.y += ((l.y - f.y) / Math.max(d, 1)) * f.sp.speed * 0.6 * dt;
        if (d < f.sp.size * 0.6 && !this.hooked) this.bite(f);
      } else {
        f.x += f.dir * f.sp.speed * dt; f.y += Math.sin(f.wob * 0.5) * 4 * dt;
        f.y = clamp(f.y, f.sp.depth[0], f.sp.depth[1]);
      }
    }
    this.fish = this.fish.filter((f) => f === this.hooked || (f.x > -40 && f.x < W + 40));
    while (this.fish.length < 7) this.spawnFish(false);
  }
  bite(f) {
    this.hooked = f; this.mode = 'bite'; this.biteT = f.sp.junk ? 1.2 : 0.75;
    this.lure.x = f.x; this.lure.y = f.y;
    this.msg = { text: 'BITE! press now!', t: 0.75 };
    this.audio.tone({ freq: 520, dur: 0.08, type: 'triangle', vol: 0.15 }); this.audio.tone({ freq: 520, dur: 0.08, type: 'triangle', vol: 0.15, delay: 0.12 });
  }
  fight(dt, hold) {
    const f = this.hooked, sp = f.sp;
    const surge = (Math.sin(this.time * 2.3 + f.wob) * 0.5 + 0.5) * sp.str * (0.6 + f.kg / 6);
    this.tension += (hold ? 0.55 + surge * 0.45 : -0.6 + surge * 0.15) * dt;
    if (!hold && Math.random() < dt * sp.str * 0.8) this.tension += 0.08; // a sudden tug
    this.tension = Math.max(0, this.tension);
    const tx = TIP.x + 14, ty = SURF + 4, dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy);
    if (hold && this.tension < 0.85) { f.x += (dx / d) * (44 / sp.str) * dt; f.y += (dy / d) * (32 / sp.str) * dt; }
    else if (!hold) { f.x += -(dx / d) * 6 * sp.str * dt; f.y += Math.sin(this.time * 3) * 10 * dt; }
    f.x = clamp(f.x, TIP.x + 10, W - 6); f.y = clamp(f.y, SURF + 4, FLOOR - 3);
    f.dir = Math.sin(this.time * 4) > 0 ? 1 : -1;
    this.lure.x = f.x; this.lure.y = f.y;
    this.slack = this.tension < 0.15 ? this.slack + dt : 0;
    if (this.tension > 1) { this.lose('SNAP! the line broke'); this.audio.tone({ freq: 1200, to: 200, dur: 0.2, type: 'square', vol: 0.12 }); return; }
    if (this.slack > 2.2) { this.lose('the line went slack and it swam off'); return; }
    if (hold && Math.random() < dt * 8) this.audio.tone({ freq: 220 + this.tension * 300, dur: 0.03, type: 'square', vol: 0.03 });
    if (d < 12) this.land(f);
  }
  lose(why) {
    const f = this.hooked; f.cool = 6; f.interest = 0;
    this.hooked = null; this.reset(); this.msg = { text: why, t: 1.6 };
  }
  land(f) {
    this.fish = this.fish.filter((x) => x !== f);
    this.hooked = null; this.lure = null;
    const pts = Math.round(f.sp.pts * (1 + f.kg / Math.max(1, f.sp.kg[1])));
    this.score += pts; this.catches.push(f);
    const j = this.journal[f.sp.name] || { count: 0, best: 0 };
    j.count++; const record = f.kg > j.best; j.best = Math.max(j.best, f.kg);
    this.journal[f.sp.name] = j; store.set('deepcast:journal', this.journal);
    this.card = { f, pts, record };
    this.mode = 'landed'; this.cardT = 2.4;
    this.audio.sfx(f.sp.junk ? 'blip' : f.sp.pts >= 120 ? 'win' : 'coin');
    this.particles.emit(TIP.x + 14, SURF, { count: 16, speed: [20, 70], angle: -Math.PI / 2, spread: 1.4, life: [0.3, 0.7], color: ['#cfeaff', '#ffffff'], gravity: 200 });
  }
  endDay() {
    this.state = 'over'; this.overAt = this.time; this.reset();
    this.newBest = this.score > this.best;
    if (this.newBest) { this.best = this.score; store.set('deepcast:best', this.best); }
    this.audio.sfx('win');
  }
  drawFish(ctx, f) {
    const s = f.sp.size, len = s * (f.sp.long ? 2.4 : 1.6), x = f.x, y = f.y, dir = f.dir, wag = Math.sin(f.wob * 2) * 0.3;
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
    if (f.sp.junk) { ctx.fillStyle = f.sp.color; ctx.fillRect(-6, -6, 7, 9); ctx.fillRect(-6, 1, 13, 4); ctx.restore(); return; }
    ctx.fillStyle = f.sp.color;
    ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(-len / 2 - s * 0.6, -s * 0.45 + wag * s); ctx.lineTo(-len / 2 - s * 0.6, s * 0.45 + wag * s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, len / 2, s * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    if (f.sp.stripes) { ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let i = -1; i <= 1; i++) ctx.fillRect(i * len * 0.18 - 1, -s * 0.35, 2, s * 0.7); }
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(0, -s * 0.12, len * 0.35, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#10202a'; ctx.beginPath(); ctx.arc(len * 0.32, -s * 0.08, Math.max(1, s * 0.08), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  drawBackground(ctx) {
    const day = this.state === 'play' ? 1 - this.clock / DAY : 0.3;
    const sky = ctx.createLinearGradient(0, 0, 0, SURF);
    sky.addColorStop(0, day > 0.75 ? '#3a2a5a' : '#6ab6e8'); sky.addColorStop(1, day > 0.75 ? '#f08a5a' : '#cfeaff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, SURF);
    const sa = Math.PI * (1 - day), sx = W / 2 + Math.cos(sa) * 150, sy = SURF - Math.sin(sa) * 55;
    ctx.fillStyle = day > 0.75 ? '#ffb070' : '#fff6c8'; ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d6a4a';
    ctx.beginPath(); ctx.moveTo(0, SURF); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, SURF - 10 - Math.abs(Math.sin(x * 0.02)) * 14); ctx.lineTo(W, SURF); ctx.fill();
    const water = ctx.createLinearGradient(0, SURF, 0, H);
    water.addColorStop(0, '#2a8ab0'); water.addColorStop(0.5, '#155a7a'); water.addColorStop(1, '#0a2a3c');
    ctx.fillStyle = water; ctx.fillRect(0, SURF, W, H - SURF);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    for (let i = 0; i < 5; i++) { const x = (i * 83 + this.time * 6) % (W + 40) - 20; ctx.beginPath(); ctx.moveTo(x, SURF); ctx.lineTo(x + 20, SURF); ctx.lineTo(x - 10, FLOOR); ctx.lineTo(x - 26, FLOOR); ctx.fill(); }
    ctx.fillStyle = '#c9b07a'; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 12) ctx.lineTo(x, FLOOR + Math.sin(x * 0.05) * 3); ctx.lineTo(W, H); ctx.fill();
    ctx.strokeStyle = '#3a7a4a'; ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) { const x = 90 + i * 19, h = 14 + (i * 7) % 18; ctx.beginPath(); ctx.moveTo(x, FLOOR); ctx.quadraticCurveTo(x + Math.sin(this.time + i) * 5, FLOOR - h / 2, x + Math.sin(this.time * 1.3 + i) * 4, FLOOR - h); ctx.stroke(); }
    ctx.fillStyle = 'rgba(220,240,255,.5)';
    for (const b of this.bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); for (let x = 0; x <= W; x += 6) ctx.lineTo(x, SURF + Math.sin(x * 0.08 + this.time * 2) * 0.8); ctx.stroke();
  }
  drawWorld(ctx) {
    for (const f of this.fish) this.drawFish(ctx, f);
    // boat and angler
    const bob = Math.sin(this.time * 1.5) * 1;
    ctx.fillStyle = '#8a4a2a'; ctx.beginPath(); ctx.moveTo(4, SURF - 6 + bob); ctx.lineTo(66, SURF - 6 + bob); ctx.lineTo(56, SURF + 4 + bob); ctx.lineTo(12, SURF + 4 + bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2a3a4a'; ctx.fillRect(30, SURF - 22 + bob, 8, 16); ctx.beginPath(); ctx.arc(34, SURF - 26 + bob, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8c040'; ctx.fillRect(28, SURF - 31 + bob, 12, 3);
    const bend = this.mode === 'fight' ? this.tension * 10 : 0;
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(37, SURF - 16 + bob); ctx.quadraticCurveTo(52, TIP.y - 4 + bend, TIP.x, TIP.y + bend + bob); ctx.stroke();
    const l = this.lure;
    if (l) {
      ctx.strokeStyle = this.mode === 'fight' ? `rgba(255,${255 - this.tension * 200},${255 - this.tension * 200},.8)` : 'rgba(255,255,255,.6)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(TIP.x, TIP.y + bend + bob);
      const sag = this.mode === 'fight' ? (1 - this.tension) * 20 : 14;
      ctx.quadraticCurveTo((TIP.x + l.x) / 2, Math.max(TIP.y, l.y) - 4 + sag, l.x, l.y); ctx.stroke();
      if (!this.hooked) { ctx.fillStyle = '#ff4f5a'; ctx.beginPath(); ctx.arc(l.x, l.y, 2, 0, Math.PI * 2); ctx.fill(); }
      if (this.mode === 'bite') text(ctx, '!', l.x, l.y - 18, { size: 16, align: 'center', color: '#ffe066', weight: '900' });
    }
  }
  drawUI(ctx) {
    const t = (s, x, y, o) => text(ctx, s, x, y, Object.assign({ size: 8, color: '#ffffff', weight: '700', shadow: 'rgba(0,30,50,.6)', font: 'system-ui, -apple-system, "Segoe UI", sans-serif' }, o));
    if (this.state === 'title') {
      t('DEEP CAST', W / 2, 92, { size: 26, align: 'center', weight: '900', color: '#ffe066' });
      t('hold to charge your cast · let go to throw', W / 2, 128, { size: 8, align: 'center', weight: '500' });
      t('hold to reel in · press fast when a fish bites · keep the line tension in the green', W / 2, 142, { size: 7, align: 'center', weight: '500' });
      t('Space, click or touch · the deeper fish are bigger and rarer', W / 2, 156, { size: 7, align: 'center', weight: '500', color: '#cfeaff' });
      if (Math.floor(this.time * 2) % 2 === 0) t('press Space or tap to start fishing', W / 2, 184, { size: 9, align: 'center', color: '#ffe066' });
      const caught = SPECIES.filter((s) => this.journal[s.name]).length;
      t(`journal ${caught}/${SPECIES.length} species${this.best ? ` · best day ${this.best}` : ''}`, W / 2, 202, { size: 7, align: 'center', color: '#cfeaff' });
      return;
    }
    t(`${this.score} pts`, W - 8, 6, { size: 10, align: 'right' });
    if (this.state === 'play') {
      const m = Math.max(0, this.clock);
      t(`${Math.floor(m / 60)}:${String(Math.floor(m % 60)).padStart(2, '0')} left`, W - 8, 20, { size: 7, align: 'right', color: m < 20 ? '#ffb070' : '#ffffff' });
      t(`${this.catches.length} caught`, W - 8, 31, { size: 7, align: 'right' });
    }
    if (this.mode === 'charge') {
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(80, 8, 110, 8);
      ctx.fillStyle = '#ffe066'; ctx.fillRect(80, 8, 110 * this.power, 8);
      t('let go to cast', 135, 19, { size: 7, align: 'center' });
    }
    if (this.mode === 'fight') {
      const x = 80, y = 8, w = 140;
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x, y, w, 9);
      ctx.fillStyle = 'rgba(141,255,168,.45)'; ctx.fillRect(x + w * 0.3, y, w * 0.55, 9);
      ctx.fillStyle = 'rgba(255,90,90,.55)'; ctx.fillRect(x + w * 0.85, y, w * 0.15, 9);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x + clamp(this.tension, 0, 1) * w - 1, y - 2, 2, 13);
      t(this.tension > 0.85 ? 'too tight! let go' : this.tension < 0.3 ? 'slack: reel in' : 'reel!', x + w / 2, y + 12, { size: 7, align: 'center' });
    }
    if (this.mode === 'ready' && this.state === 'play') t('hold to cast', 70, 20, { size: 7, color: '#ffffff', weight: '600' });
    if (this.mode === 'sink') t('hold to reel in · fish bite when the lure is near', 80, 20, { size: 7, weight: '600' });
    if (this.msg) t(this.msg.text, W / 2, 92, { size: 10, align: 'center', color: '#ffe066', alpha: Math.min(1, this.msg.t * 3) });
    if (this.card) {
      const c = this.card, f = c.f;
      ctx.fillStyle = 'rgba(8,30,45,.85)'; ctx.fillRect(W / 2 - 90, 80, 180, 76);
      this.drawFish(ctx, Object.assign({}, f, { x: W / 2, y: 104, dir: 1 }));
      t(f.sp.junk ? `an ${f.sp.name.toLowerCase()}...` : `${f.sp.name}  ${f.kg.toFixed(2)} kg`, W / 2, 122, { size: 10, align: 'center' });
      t(`+${c.pts}${c.record && !f.sp.junk ? '  · new personal record!' : ''}`, W / 2, 138, { size: 8, align: 'center', color: '#8dffa8' });
    }
    if (this.state === 'over') {
      ctx.fillStyle = 'rgba(8,30,45,.88)'; ctx.fillRect(0, 0, W, H);
      t('THE SUN HAS SET', W / 2, 26, { size: 16, align: 'center', color: '#ffb070' });
      t(`${this.score} points from ${this.catches.length} catch${this.catches.length === 1 ? '' : 'es'}${this.newBest ? ' · best day yet!' : ''}`, W / 2, 50, { size: 9, align: 'center' });
      SPECIES.forEach((s, i) => {
        const j = this.journal[s.name], y = 76 + i * 18, todayN = this.catches.filter((f) => f.sp === s).length;
        t(j ? s.name : '???', W / 2 - 110, y, { size: 8, color: j ? s.color : '#557' });
        t(j ? `today ${todayN} · total ${j.count} · biggest ${j.best.toFixed(2)} kg` : 'not caught yet', W / 2 + 110, y, { size: 7, align: 'right', weight: '500', color: j ? '#ffffff' : '#557' });
      });
      if (this.time - this.overAt > 1.2) t('Space or tap for another day', W / 2, 200, { size: 9, align: 'center', color: '#ffe066' });
    }
  }
}

game.start(new Play());
window.deepCast = game;
</script>
</body>
</html>
