<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Gambit</title>
<style>
  :root {
    --bg: #f3efe7; --panel: #fffdf8; --ink: #2a241d; --dim: #7a6f62; --line: #e2d9ca;
    --accent: #b5651d; --accent-ink: #fff; --good: #3f8f5a; --bad: #c0392b;
    --light: #f0d9b5; --dark: #b58863; --hl: rgba(255, 214, 10, .42); --sel: rgba(255, 214, 10, .6);
    --dot: rgba(30, 20, 10, .28); --shadow: 0 10px 30px rgba(60, 40, 20, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f; --panel: #221e18; --ink: #efe7da; --dim: #a39887; --line: #3a332a;
      --accent: #e0913f; --accent-ink: #1b140c; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f; --panel: #221e18; --ink: #efe7da; --dim: #a39887; --line: #3a332a;
    --accent: #e0913f; --accent-ink: #1b140c; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  }
  body[data-board="sage"] { --light: #eeeed2; --dark: #769656; }
  body[data-board="slate"] { --light: #dee3e6; --dark: #7d97a6; }
  body[data-board="rose"] { --light: #f4e1dc; --dark: #b9776e; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
  body { font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 15px;
    -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 1060px; margin: 0 auto; padding: 14px 16px 4px; }
  header h1 { font-size: 22px; font-weight: 650; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  header h1 span { color: var(--accent); }
  .layout { display: flex; gap: 24px; justify-content: center; align-items: flex-start;
    max-width: 1060px; margin: 0 auto; padding: 8px 16px 24px; }
  .board-col { width: min(calc(100vw - 32px), calc(100vh - 130px), 660px); min-width: 280px; }
  .side { width: 310px; flex: none; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 920px) {
    .layout { flex-direction: column; align-items: center; }
    .side { width: min(calc(100vw - 32px), 660px); }
    .board-col { width: min(calc(100vw - 32px), 660px); }
  }

  .player { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 2px; }
  .avatar { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 20px;
    background: var(--panel); border: 1px solid var(--line); line-height: 1; flex: none; }
  .pname { font-weight: 600; white-space: nowrap; }
  .pmeta { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .caps { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; color: var(--dim);
    font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", "Apple Symbols", serif; font-size: 17px; letter-spacing: -2px; }
  .caps b { letter-spacing: 0; font-family: ui-rounded, system-ui, sans-serif; font-size: 13px; font-weight: 600; margin-left: 6px; color: var(--dim); }
  .think { display: none; gap: 3px; }
  .think.on { display: inline-flex; }
  .think i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bob 1s infinite ease-in-out; }
  .think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  .board-row { display: flex; gap: 8px; }
  .evalbar { width: 14px; flex: none; border-radius: 4px; overflow: hidden; position: relative; background: #2b2723;
    box-shadow: var(--shadow); }
  .evalbar .w { position: absolute; left: 0; right: 0; bottom: 0; background: #f4f1ea; transition: height .5s ease; height: 50%; }
  .evalbar .lbl { position: absolute; left: 0; right: 0; font-size: 9px; font-weight: 700; text-align: center; z-index: 1; }
  .evalbar.hidden { display: none; }
  .board-wrap { flex: 1; position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow);
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { position: relative; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.last::before, .sq.sel::before { content: ""; position: absolute; inset: 0; background: var(--hl); }
  .sq.sel::before { background: var(--sel); }
  .sq.check::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(230, 30, 20, .9) 0%, rgba(230, 30, 20, .5) 35%, rgba(230, 30, 20, 0) 70%); }
  .sq.tgt::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; transform: translate(-50%, -50%);
    border-radius: 50%; background: var(--dot); z-index: 2; pointer-events: none; }
  .sq.tgt.cap::after { width: 92%; height: 92%; background: none; border: calc(var(--sq) * .08) solid var(--dot); }
  .sq.hover { box-shadow: inset 0 0 0 calc(var(--sq) * .05) rgba(255, 255, 255, .7); }
  .coord { position: absolute; font-size: calc(var(--sq) * .19); font-weight: 700; line-height: 1; pointer-events: none; }
  .coord.f { right: 4%; bottom: 4%; } .coord.r { left: 5%; top: 5%; }
  .sq.l .coord { color: var(--dark); } .sq.d .coord { color: var(--light); }

  #pieces, #arrows { position: absolute; inset: 0; pointer-events: none; }
  #arrows { z-index: 6; }
  .pc { position: absolute; width: 12.5%; height: 12.5%; display: grid; place-items: center; z-index: 3;
    font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", "Apple Symbols", serif;
    font-size: calc(var(--sq) * .8); line-height: 1; will-change: left, top; }
  .pc span { grid-area: 1 / 1; display: block; transform: translateY(-2%); }
  .pc.w .fill { color: #fffaf0; } .pc.w .line { color: #1f1912; }
  .pc.b .fill { color: #241e19; text-shadow: 0 0 1px rgba(255, 245, 230, .35); }
  .pc .fill { filter: drop-shadow(0 calc(var(--sq) * .03) calc(var(--sq) * .02) rgba(0, 0, 0, .35)); }
  .pc.anim { transition: left .2s cubic-bezier(.3, .7, .3, 1), top .2s cubic-bezier(.3, .7, .3, 1); }
  .pc.drag { z-index: 10; transform: scale(1.12); transition: none; }
  .pc.fade { animation: fade .25s forwards; }
  @keyframes fade { to { opacity: 0; transform: scale(.6); } }

  #promo { position: absolute; z-index: 20; width: 12.5%; display: none; flex-direction: column; background: var(--panel);
    border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); overflow: hidden; }
  #promo.on { display: flex; }
  #promo button { aspect-ratio: 1; border: 0; background: none; position: relative; }
  #promo button:hover, #promo button:focus-visible { background: var(--hl); outline: none; }
  #promo .pc { position: static; width: 100%; height: 100%; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
  #status { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; min-height: 24px; }
  #status .dotc { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #7774; flex: none; }
  #substatus { color: var(--dim); font-size: 13px; margin-top: 4px; min-height: 17px; }
  #moves { max-height: 270px; min-height: 120px; overflow-y: auto; display: grid; grid-template-columns: 34px 1fr 1fr;
    font-variant-numeric: tabular-nums; font-size: 14px; align-content: start; }
  #moves .n { color: var(--dim); padding: 4px 0; text-align: right; padding-right: 8px; }
  #moves .mv { padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  #moves .mv:hover { background: var(--line); }
  #moves .mv.cur { background: var(--accent); color: var(--accent-ink); }
  #moves .empty { grid-column: 1 / -1; color: var(--dim); font-size: 13px; padding: 4px 0; }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .settings { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .swatches { display: flex; gap: 6px; }
  .swatch { width: 26px; height: 26px; border-radius: 6px; border: 2px solid transparent; padding: 0; overflow: hidden;
    background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); }
  .swatch.on { border-color: var(--accent); }
  .toggle { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
  .toggle.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .keys { color: var(--dim); font-size: 12px; line-height: 1.5; }
  kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; }

  .modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(20, 14, 8, .55); z-index: 50; padding: 16px;
    backdrop-filter: blur(3px); }
  .modal.on { display: grid; }
  .dialog { background: var(--panel); border-radius: 16px; padding: 24px; width: min(440px, 100%); box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .dialog h2 { font-size: 24px; font-weight: 700; }
  .dialog h2 span { color: var(--accent); }
  .dialog .lead { color: var(--dim); line-height: 1.5; margin-top: -8px; }
  .field > label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 700; margin-bottom: 6px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 6px; font-weight: 600; font-size: 14px; }
  .seg button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .levels button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 2px; font-size: 18px; line-height: 1.1; }
  .levels button small { display: block; font-size: 11px; font-weight: 600; margin-top: 3px; }
  .levels button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
  #levelDesc { color: var(--dim); font-size: 13px; margin-top: 6px; min-height: 18px; }
  .dialog .big { font-size: 17px; padding: 12px; border-radius: 12px; }
  .result-icon { font-size: 56px; text-align: center; line-height: 1; font-family: "Segoe UI Symbol", "DejaVu Sans", serif; }
  .result h2 { text-align: center; }
  .result p { text-align: center; color: var(--dim); margin-top: -8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; }
  #toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body data-board="walnut">
<header>
  <h1><span>♛&#xFE0E;</span> Royal Gambit</h1>
  <button class="btn primary" id="newBtn">New game</button>
</header>
<div class="layout">
  <div class="board-col">
    <div class="player" id="topBar"></div>
    <div class="board-row">
      <div class="evalbar" id="evalbar" title="Evaluation"><div class="w" id="evalW"></div><div class="lbl" id="evalLbl"></div></div>
      <div class="board-wrap" id="wrap">
        <div id="board"></div>
        <div id="pieces"></div>
        <svg id="arrows" viewBox="0 0 8 8"></svg>
        <div id="promo"></div>
      </div>
    </div>
    <div class="player" id="botBar"></div>
  </div>
  <aside class="side">
    <div class="card">
      <div id="status"></div>
      <div id="substatus"></div>
    </div>
    <div class="card">
      <div id="moves"></div>
      <div class="nav">
        <button class="btn" id="navFirst" aria-label="First move">⏮</button>
        <button class="btn" id="navPrev" aria-label="Previous move">◀</button>
        <button class="btn" id="navNext" aria-label="Next move">▶</button>
        <button class="btn" id="navLast" aria-label="Latest move">⏭</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="hintBtn">💡 Hint</button>
      <button class="btn" id="undoBtn">↶ Undo</button>
      <button class="btn" id="flipBtn">⇅ Flip board</button>
      <button class="btn" id="resignBtn">⚑ Resign</button>
    </div>
    <div class="card settings">
      <div class="setrow"><span>Board</span><div class="swatches" id="swatches"></div></div>
      <div class="setrow"><span>Evaluation bar</span><button class="toggle" id="evalTog">On</button></div>
      <div class="setrow"><span>Sound</span><button class="toggle" id="soundTog">On</button></div>
      <div class="keys"><kbd>←</kbd> <kbd>→</kbd> step through moves · <kbd>H</kbd> hint · <kbd>U</kbd> undo · <kbd>F</kbd> flip</div>
    </div>
  </aside>
</div>

<div class="modal" id="setup">
  <div class="dialog" role="dialog" aria-labelledby="setupTitle">
    <h2 id="setupTitle"><span>♛&#xFE0E;</span> Royal Gambit</h2>
    <p class="lead">Classic chess against a computer opponent with five levels, or pass-and-play with a friend.</p>
    <div class="field"><label>Opponent</label>
      <div class="seg" id="modeSeg"><button data-v="ai">🤖 Computer</button><button data-v="friend">👥 Friend</button></div></div>
    <div class="field" id="sideField"><label>Play as</label>
      <div class="seg" id="sideSeg"><button data-v="0">♔&#xFE0E; White</button><button data-v="r">🎲 Random</button><button data-v="1">♚&#xFE0E; Black</button></div></div>
    <div class="field" id="levelField"><label>Computer level</label>
      <div class="levels" id="levelSeg"></div>
      <div id="levelDesc"></div></div>
    <button class="btn primary big" id="startBtn">Start game</button>
    <button class="btn" id="cancelSetup">Cancel</button>
  </div>
</div>

<div class="modal" id="over">
  <div class="dialog result">
    <div class="result-icon" id="overIcon"></div>
    <h2 id="overTitle"></h2>
    <p id="overReason"></p>
    <div class="row2"><button class="btn" id="reviewBtn">Review game</button><button class="btn primary" id="againBtn">Play again</button></div>
    <button class="btn" id="overNew">Change settings</button>
  </div>
</div>
<div id="toast"></div>

<script>
// CORE-START
function ChessCore() {
  const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
  const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const VAL = [0, 100, 320, 330, 500, 900, 0];
  const PH = [0, 0, 1, 1, 2, 4, 0];
  const NO = [-33, -31, -18, -14, 14, 18, 31, 33], BO = [-17, -15, 15, 17], RO = [-16, -1, 1, 16];
  const KO = [-17, -16, -15, -1, 1, 15, 16, 17];
  const F_DBL = 1, F_EP = 2, F_OO = 3, F_OOO = 4;
  const MATE = 100000, INF = 1e9;

  // Piece-square tables, rank 8 first, from White's point of view.
  const PST = [null,
    [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5,
     0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
    [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30,
     -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
    [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10,
     -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
    [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
    [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5,
     0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20]];
  const KMG = [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
    -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10,
    20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20];
  const KEG = [-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30,
    -30,-10,30,40,40,30,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30,
    -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50];

  // Zobrist keys
  let seed = 0x2545F491;
  const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; };
  const ZP = []; for (let p = 0; p < 16; p++) { ZP[p] = new Int32Array(128); for (let s = 0; s < 128; s++) ZP[p][s] = rnd(); }
  const ZC = new Int32Array(16); for (let i = 0; i < 16; i++) ZC[i] = rnd();
  const ZE = new Int32Array(128); for (let i = 0; i < 128; i++) ZE[i] = rnd();
  const ZT = rnd();
  const CMASK = new Uint8Array(128).fill(15);
  CMASK[116] = 12; CMASK[119] = 14; CMASK[112] = 13; CMASK[4] = 3; CMASK[7] = 11; CMASK[0] = 7;

  const sqName = s => 'abcdefgh'[s & 7] + (8 - (s >> 4));
  const sqIdx = n => (8 - +n[1]) * 16 + 'abcdefgh'.indexOf(n[0]);
  const LET = ' pnbrqk';

  class Pos {
    constructor(fen) { this.load(fen || START); }
    load(fen) {
      const [bd, turn, cas, ep, half, full] = fen.trim().split(/\s+/);
      this.b = new Int8Array(128); this.kings = [0, 0];
      let r = 0, c = 0;
      for (const ch of bd) {
        if (ch === '/') { r++; c = 0; continue; }
        if (ch >= '1' && ch <= '8') { c += +ch; continue; }
        const lo = ch.toLowerCase(), t = LET.indexOf(lo), col = ch === lo ? 1 : 0, sq = r * 16 + c;
        this.b[sq] = t | (col << 3); if (t === K) this.kings[col] = sq; c++;
      }
      this.turn = turn === 'b' ? 1 : 0;
      this.castle = 0;
      if (cas && cas !== '-') {
        if (cas.includes('K')) this.castle |= 1; if (cas.includes('Q')) this.castle |= 2;
        if (cas.includes('k')) this.castle |= 4; if (cas.includes('q')) this.castle |= 8;
      }
      this.ep = ep && ep !== '-' ? sqIdx(ep) : -1;
      this.half = +half || 0; this.full = +full || 1;
      this.stack = []; this.hashes = [];
      this.hash = this.computeHash();
    }
    computeHash() {
      let h = 0;
      for (let s = 0; s < 120; s++) { if (s & 0x88) { s += 7; continue; } if (this.b[s]) h ^= ZP[this.b[s]][s]; }
      h ^= ZC[this.castle]; if (this.ep >= 0) h ^= ZE[this.ep]; if (this.turn) h ^= ZT;
      return h;
    }
    fen() {
      let s = '';
      for (let r = 0; r < 8; r++) {
        let e = 0;
        for (let c = 0; c < 8; c++) {
          const p = this.b[r * 16 + c];
          if (!p) { e++; continue; }
          if (e) { s += e; e = 0; }
          const l = LET[p & 7]; s += p >> 3 ? l : l.toUpperCase();
        }

  // ---------- Board geometry ----------

  function sqAt(x, y) {

  // ---------- Game flow ----------

  function showOver() {

    }

  $('soundTog').onclick = () => { S.sound = !S.sound; save(); renderButtons(); sfx('move'); };
  for (const [k, [a, b]] of Object.entries(BOARDS)) {
    const el = document.createElement('button'); el.className = 'swatch'; el.dataset.v = k; el.title = k[0].toUpperCase() + k.slice(1);
    el.style.setProperty('--a', a); el.style.setProperty('--b', b);
    el.onclick = () => { S.board = k; save(); renderButtons(); };
    $('swatches').appendChild(el);
  }
  addEventListener('keydown', e => {
    if (e.target.closest('input, textarea') || document.querySelector('.modal.on')) {

    }
    if (e.key === 'ArrowLeft') { go(view - 1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { go(view + 1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { go(0); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { go(hist.length); e.preventDefault(); }
    else if (e.key === 'h' || e.key === 'H') showHint();
    else if (e.key === 'u' || e.key === 'U' || ((e.ctrlKey || e.metaKey) && e.key === 'z')) { undo(); e.preventDefault(); }
    else if (e.key === 'f' || e.key === 'F') $('flipBtn').click();
    else if (e.key === 'Escape') { selected = -1; promoEl.classList.remove('on'); render(false); }
  });

  // ---------- Setup dialog ----------
  const draft = {};
  function openSetup() {
    Object.assign(draft, { mode: S.mode, side: S.side, level: S.level });
    const lv = $('levelSeg'); lv.innerHTML = '';
    LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.dataset.v = i; b.innerHTML = `${L.icon}${VS}<small>${L.name}</small>`; lv.appendChild(b); });
    syncSetup(); $('setup').classList.add('on'); $('startBtn').focus();
  }
  function syncSetup() {
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === draft.mode));
    document.querySelectorAll('#sideSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === draft.side));
    document.querySelectorAll('#levelSeg button').forEach(b => b.classList.toggle('on', +b.dataset.v === draft.level));
    $('sideField').style.display = $('levelField').style.display = draft.mode === 'ai' ? '' : 'none';
    $('levelDesc').textContent = LEVELS[draft.level].desc;
  }
  $('modeSeg').onclick = e => { const b = e.target.closest('button'); if (b) { draft.mode = b.dataset.v; syncSetup(); } };
  $('sideSeg').onclick = e => { const b = e.target.closest('button'); if (b) { draft.side = b.dataset.v; syncSetup(); } };
  $('levelSeg').onclick = e => { const b = e.target.closest('button'); if (b) { draft.level = +b.dataset.v; syncSetup(); } };
  $('startBtn').onclick = () => { Object.assign(S, draft); $('setup').classList.remove('on'); sfx('move'); newGame(); };
  $('cancelSetup').onclick = () => $('setup').classList.remove('on');
  $('newBtn').onclick = openSetup;
  $('reviewBtn').onclick = () => $('over').classList.remove('on');
  $('overNew').onclick = () => { $('over').classList.remove('on'); openSetup(); };
  $('againBtn').onclick = () => {
    $('over').classList.remove('on');
    if ($('againBtn').dataset.next) S.level++;
    newGame();
  };
  document.querySelectorAll('.modal').forEach(m => m.addEventListener('pointerdown', e => { if (e.target === m && hist.length + (over ? 1 : 0)) m.classList.remove('on'); }));

  // ---------- Boot ----------
  const resumed = load();
  legal = pos.legal(); sizeVars(); render(false);
  if (resumed && (hist.length || over)) { requestEval(); maybeAI(); if (hist.length && !over) toast('Welcome back — your game was saved'); }
  else openSetup();
})();
</script>
</body>
</html>
