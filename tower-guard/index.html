<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tower Guard</title>
<style>html, body { margin: 0; height: 100%; background: #0f1a14; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../flint/flint.js"></script>
<script>
'use strict';
// Tower Guard: build towers along the path and stop 15 waves. Built with Flint.
const { Game, Scene, text, store, clamp, rand, pick } = Flint;

const W = 360, H = 240, T = 20, COLS = 18, ROWS = 10, OY = 20, WAVES = 15;
const game = new Game({ canvas: '#game', width: W, height: H, background: '#0f1a14', letterbox: '#0f1a14', touchButtons: [] });
game.input.bind('wave', ['Space', 'Enter', 'PadA']);

// the road, as tile waypoints (it enters at the left and leaves at the bottom)
const WAY = [[-1, 1], [5, 1], [5, 5], [10, 5], [10, 2], [15, 2], [15, 7], [8, 7], [8, 9], [3, 9], [3, 11]];
const TOWERS = {
  bolt: { name: 'Bolt', key: '1', cost: 40, color: '#ffe066', range: [2.6, 2.9, 3.2], rate: [0.45, 0.35, 0.25], dmg: [6, 10, 16], up: [50, 80] },
  frost: { name: 'Frost', key: '2', cost: 60, color: '#4dd9e8', range: [2.2, 2.5, 2.8], rate: [1.1, 1, 0.9], dmg: [2, 4, 6], slow: [0.5, 0.42, 0.34], up: [60, 90] },
  cannon: { name: 'Cannon', key: '3', cost: 90, color: '#ff8a5a', range: [3, 3.3, 3.6], rate: [1.6, 1.4, 1.2], dmg: [22, 36, 58], splash: [1, 1.15, 1.3], up: [90, 130] },
};
const FOES = {
  walker: { hp: 30, speed: 1.4, cash: 6, color: '#c0f070', r: 4.5 },
  runner: { hp: 18, speed: 2.6, cash: 5, color: '#ffd23f', r: 3.5 },
  tank: { hp: 110, speed: 0.8, cash: 14, color: '#b98cff', r: 6.5 },
  boss: { hp: 600, speed: 0.6, cash: 80, color: '#ff4f5a', r: 9 },
};

function pathTiles() {
  const set = new Set();
  for (let i = 0; i < WAY.length - 1; i++) {
    const [x0, y0] = WAY[i], [x1, y1] = WAY[i + 1];
    for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) set.add(x + ',' + y);
  }
  return set;
}
const PATH = pathTiles();
const PTS = WAY.map(([x, y]) => ({ x: x * T + T / 2, y: OY + y * T + T / 2 }));
const SEGLEN = PTS.slice(1).map((p, i) => Math.hypot(p.x - PTS[i].x, p.y - PTS[i].y));
const TOTAL = SEGLEN.reduce((a, b) => a + b, 0);
function along(d) {
  for (let i = 0; i < SEGLEN.length; i++) {
    if (d <= SEGLEN[i]) { const a = PTS[i], b = PTS[i + 1], k = d / SEGLEN[i]; return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k }; }
    d -= SEGLEN[i];
  }
  return PTS[PTS.length - 1];
}

function waveList(n) {
  const list = [], add = (kind, count, gap) => { for (let i = 0; i < count; i++) list.push({ kind, gap }); };
  add('walker', 5 + n * 2, 0.8);
  if (n >= 2) add('runner', 2 + n, 0.45);
  if (n >= 4) add('tank', Math.floor(n / 2), 1.4);
  if (n % 5 === 0) add('boss', n / 5, 2);
  return list;
}

class Play extends Scene {
  enter() { this.state = 'title'; this.best = store.get('towerguard:best', 0); this.sel = 'bolt'; this.towers = []; this.foes = []; }
  begin() {
    Object.assign(this, { state: 'build', money: 140, lives: 20, wave: 0, towers: [], foes: [], shots: [], queue: [], spawnT: 0, picked: null, fast: false, auto: 12, kills: 0 });
    this.audio.sfx('select');
  }
  startWave() {
    if (this.state !== 'build') return;
    this.wave++;
    this.queue = waveList(this.wave);
    this.hpScale = 1 + (this.wave - 1) * 0.2;
    this.state = 'wave'; this.spawnT = 0.5;
    this.banner = { text: this.wave % 5 === 0 ? `WAVE ${this.wave} · BOSS` : `WAVE ${this.wave}`, t: 1.6 };
    this.audio.tone({ freq: 220, to: 440, dur: 0.3, type: 'sawtooth', vol: 0.08 });
  }
  tileAt(x, y) { const tx = Math.floor(x / T), ty = Math.floor((y - OY) / T); return tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS ? { tx, ty } : null; }
  towerAt(tx, ty) { return this.towers.find((t) => t.tx === tx && t.ty === ty); }
  tap(x, y) {
    // tower picker along the bottom
    if (y > OY + ROWS * T) {
      const i = Math.floor((x - 8) / 80);
      const keys = Object.keys(TOWERS);
      if (i >= 0 && i < 3) { this.sel = keys[i]; this.picked = null; this.audio.sfx('blip'); }
      else if (x > W - 70) this.state === 'build' ? this.startWave() : (this.fast = !this.fast);
      return;
    }
    const tile = this.tileAt(x, y);
    if (!tile) return;
    const t = this.towerAt(tile.tx, tile.ty);
    if (t) { this.picked = this.picked === t ? null : t; this.audio.sfx('blip'); return; }
    this.picked = null;
    if (PATH.has(tile.tx + ',' + tile.ty)) return;
    const def = TOWERS[this.sel];
    if (this.money < def.cost) { this.banner = { text: 'not enough gold', t: 0.8 }; return; }
    this.money -= def.cost;
    this.towers.push({ kind: this.sel, tx: tile.tx, ty: tile.ty, x: tile.tx * T + T / 2, y: OY + tile.ty * T + T / 2, lvl: 0, cd: 0, spent: def.cost, aim: 0, flash: 0 });
    this.audio.tone({ freq: 330, to: 660, dur: 0.12, type: 'triangle', vol: 0.12 });
    this.particles.emit(tile.tx * T + T / 2, OY + tile.ty * T + T / 2, { count: 10, speed: [20, 50], life: [0.2, 0.5], color: def.color });
  }
  upgrade(t) {
    const def = TOWERS[t.kind];
    if (t.lvl >= 2) return;
    const cost = def.up[t.lvl];
    if (this.money < cost) { this.banner = { text: 'not enough gold', t: 0.8 }; return; }
    this.money -= cost; t.spent += cost; t.lvl++;
    this.audio.sfx('powerup');
    this.particles.emit(t.x, t.y, { count: 16, speed: [20, 60], life: [0.3, 0.6], color: [def.color, '#ffffff'] });
  }
  sell(t) { this.money += Math.floor(t.spent * 0.6); this.towers = this.towers.filter((x) => x !== t); this.picked = null; this.audio.sfx('coin'); }
  update(dt) {
    const input = this.input, p = input.pointer;
    if (input.pressed('KeyM')) this.audio.toggleMute();
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    if (this.state === 'title' || this.state === 'over' || this.state === 'won') {
      if (this.time > 0.5 && (input.pressed('wave') || p.pressed) && (this.state === 'title' || this.time - this.overAt > 1.2)) this.begin();
      return;
    }
    if (input.pressed('Digit1')) this.sel = 'bolt';
    if (input.pressed('Digit2')) this.sel = 'frost';
    if (input.pressed('Digit3')) this.sel = 'cannon';
    if (input.pressed('KeyF')) this.fast = !this.fast;
    if (this.picked && input.pressed('KeyU')) this.upgrade(this.picked);
    if (this.picked && (input.pressed('KeyS') || input.pressed('Delete') || input.pressed('Backspace'))) this.sell(this.picked);
    if (input.pressed('wave')) this.startWave();
    if (p.pressed) {
      // the upgrade / sell buttons in the panel
      if (this.picked && p.y < OY && p.x > W - 150) { if (p.x < W - 75) this.upgrade(this.picked); else this.sell(this.picked); }
      else this.tap(p.x, p.y);
    }
    const steps = this.fast ? 2 : 1;
    for (let s = 0; s < steps; s++) this.sim(dt);
  }
  sim(dt) {
    if (this.state === 'build') { this.auto -= dt; if (this.auto <= 0 && this.wave > 0) this.startWave(); }
    if (this.state === 'wave') {
      this.spawnT -= dt;
      if (this.queue.length && this.spawnT <= 0) {
        const q = this.queue.shift(), f = FOES[q.kind];
        this.foes.push({ kind: q.kind, d: 0, hp: f.hp * this.hpScale, max: f.hp * this.hpScale, slowT: 0, slowK: 1, x: PTS[0].x, y: PTS[0].y, wob: rand(0, 6) });
        this.spawnT = q.gap;
      }
      if (!this.queue.length && !this.foes.length) {
        if (this.wave >= WAVES) return this.finish(true);
        this.state = 'build'; this.auto = 12;
        const bonus = 20 + this.wave * 5; this.money += bonus;
        this.banner = { text: `wave cleared · +${bonus} gold`, t: 1.4 };
        this.audio.sfx('coin');
      }
    }
    for (const f of this.foes) {
      const def = FOES[f.kind];
      f.slowT -= dt; if (f.slowT <= 0) f.slowK = 1;
      f.d += def.speed * T * f.slowK * dt; f.wob += dt * 6;
      const q = along(f.d); f.x = q.x; f.y = q.y;
      if (f.d >= TOTAL) { f.dead = true; this.lives -= f.kind === 'boss' ? 5 : 1; this.camera.shake(3, 0.2); this.audio.sfx('hurt'); }
    }
    for (const t of this.towers) {
      const def = TOWERS[t.kind], range = def.range[t.lvl] * T;
      t.cd -= dt; t.flash = Math.max(0, t.flash - dt);
      if (t.cd > 0) continue;
      const inRange = this.foes.filter((f) => !f.dead && Math.hypot(f.x - t.x, f.y - t.y) < range);
      if (!inRange.length) continue;
      t.cd = def.rate[t.lvl]; t.flash = 0.12;
      if (t.kind === 'frost') {
        for (const f of inRange) { this.hurt(f, def.dmg[t.lvl]); f.slowK = Math.min(f.slowK, def.slow[t.lvl]); f.slowT = 1.6; }
        this.shots.push({ kind: 'ring', x: t.x, y: t.y, r: 0, max: range, t: 0.3 });
        this.audio.tone({ freq: 1200, to: 900, dur: 0.08, type: 'sine', vol: 0.03 });
        continue;
      }
      const target = inRange.reduce((a, b) => (b.d > a.d ? b : a));
      t.aim = Math.atan2(target.y - t.y, target.x - t.x);
      if (t.kind === 'bolt') {
        this.hurt(target, def.dmg[t.lvl]);
        this.shots.push({ kind: 'beam', x: t.x, y: t.y, tx: target.x, ty: target.y, t: 0.08, color: def.color });
        this.audio.tone({ freq: 1500, dur: 0.03, type: 'square', vol: 0.02 });
      } else {
        this.shots.push({ kind: 'shell', x: t.x, y: t.y, tx: target.x, ty: target.y, sx: t.x, sy: t.y, k: 0, dmg: def.dmg[t.lvl], splash: def.splash[t.lvl] * T });
        this.audio.tone({ freq: 120, to: 60, dur: 0.12, type: 'sine', vol: 0.15 });
      }
    }
    for (const s of this.shots) {
      if (s.kind === 'shell') {
        s.k += dt * 2.6; s.x = s.sx + (s.tx - s.sx) * s.k; s.y = s.sy + (s.ty - s.sy) * s.k - Math.sin(Math.min(1, s.k) * Math.PI) * 12;
        if (s.k >= 1) {
          s.done = true;
          for (const f of this.foes) if (!f.dead && Math.hypot(f.x - s.tx, f.y - s.ty) < s.splash) this.hurt(f, s.dmg);
          this.particles.emit(s.tx, s.ty, { count: 14, speed: [20, 70], life: [0.2, 0.5], color: ['#ff8a5a', '#ffd23f', '#5a3a2a'] });
          this.audio.noise({ dur: 0.12, vol: 0.08, freq: 900 });
        }
      } else { s.t -= dt; if (s.kind === 'ring') s.r = s.max * (1 - s.t / 0.3); if (s.t <= 0) s.done = true; }
    }
    this.shots = this.shots.filter((s) => !s.done);
    this.foes = this.foes.filter((f) => !f.dead);
    if (this.lives <= 0) this.finish(false);
  }
  hurt(f, dmg) {
    if (f.dead) return;
    f.hp -= dmg;
    if (f.hp <= 0) {
      f.dead = true; this.kills++;
      const def = FOES[f.kind];
      this.money += def.cash;
      this.particles.emit(f.x, f.y, { count: f.kind === 'boss' ? 40 : 8, speed: [20, 60], life: [0.2, 0.5], color: def.color });
      if (f.kind === 'boss') { this.audio.sfx('explode'); this.camera.shake(4, 0.4); }
    }
  }
  finish(won) {
    this.state = won ? 'won' : 'over'; this.overAt = this.time;
    this.audio.sfx(won ? 'win' : 'lose');
    const score = this.wave * 1000 + this.lives * 100 + this.kills * 5;
    this.final = score;
    this.newBest = score > this.best;
    if (this.newBest) { this.best = score; store.set('towerguard:best', score); }
  }
  blur() { /* waves only advance while you watch */ }
  drawTower(ctx, t, x, y, alpha = 1) {
    const def = TOWERS[t.kind];
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#2a3a30'; ctx.fillRect(x - 8, y - 8, 16, 16);
    ctx.fillStyle = t.flash > 0 ? '#ffffff' : def.color;
    if (t.kind === 'bolt') { ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 6, y + 5); ctx.lineTo(x - 6, y + 5); ctx.closePath(); ctx.fill(); }
    else if (t.kind === 'frost') { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; ctx.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6); } ctx.closePath(); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = def.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(t.aim || 0) * 9, y + Math.sin(t.aim || 0) * 9); ctx.stroke(); }
    for (let i = 0; i < (t.lvl || 0); i++) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 6 + i * 5, y + 9, 3, 2); }
    ctx.globalAlpha = 1;
  }
  drawBackground(ctx) {
    ctx.fillStyle = '#0f1a14'; ctx.fillRect(0, 0, W, H);
    for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
      const x = tx * T, y = OY + ty * T;
      if (PATH.has(tx + ',' + ty)) { ctx.fillStyle = (tx + ty) % 2 ? '#5a4a36' : '#544430'; ctx.fillRect(x, y, T, T); }
      else { ctx.fillStyle = (tx + ty) % 2 ? '#1c3324' : '#1a2f21'; ctx.fillRect(x, y, T, T); }
    }
  }
  drawWorld(ctx) {
    if (this.state === 'title') return;
    const p = this.input.pointer, hover = this.tileAt(p.x, p.y);
    if (hover && this.state !== 'over' && this.state !== 'won' && !this.towerAt(hover.tx, hover.ty) && !PATH.has(hover.tx + ',' + hover.ty) && p.type === 'mouse') {
      const def = TOWERS[this.sel], x = hover.tx * T + T / 2, y = OY + hover.ty * T + T / 2;
      ctx.strokeStyle = this.money >= def.cost ? 'rgba(255,255,255,.35)' : 'rgba(255,90,90,.5)';
      ctx.beginPath(); ctx.arc(x, y, def.range[0] * T, 0, Math.PI * 2); ctx.stroke();
      this.drawTower(ctx, { kind: this.sel }, x, y, 0.5);
    }
    for (const t of this.towers) this.drawTower(ctx, t, t.x, t.y);
    if (this.picked) { const def = TOWERS[this.picked.kind]; ctx.strokeStyle = def.color; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(this.picked.x, this.picked.y, def.range[this.picked.lvl] * T, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
    for (const f of this.foes) {
      const def = FOES[f.kind], r = def.r + Math.sin(f.wob) * 0.4;
      ctx.fillStyle = f.slowK < 1 ? '#bff4ff' : def.color; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f1a14'; ctx.fillRect(f.x - r * 0.45, f.y - r * 0.3, r * 0.3, r * 0.3); ctx.fillRect(f.x + r * 0.15, f.y - r * 0.3, r * 0.3, r * 0.3);
      if (f.hp < f.max) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(f.x - 7, f.y - r - 5, 14, 2); ctx.fillStyle = '#8dffa8'; ctx.fillRect(f.x - 7, f.y - r - 5, 14 * (f.hp / f.max), 2); }
    }
    for (const s of this.shots) {
      if (s.kind === 'beam') { ctx.strokeStyle = s.color; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.tx, s.ty); ctx.stroke(); }
      else if (s.kind === 'ring') { ctx.strokeStyle = `rgba(77,217,232,${s.t * 2})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke(); }
      else { ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  drawUI(ctx) {
    const t = (s, x, y, o) => text(ctx, s, x, y, Object.assign({ size: 8, color: '#eaf6ee', weight: '700', font: 'system-ui, -apple-system, "Segoe UI", sans-serif' }, o));
    if (this.state === 'title') {
      ctx.fillStyle = 'rgba(15,26,20,.8)'; ctx.fillRect(0, 0, W, H);
      t('TOWER GUARD', W / 2, 40, { size: 26, align: 'center', weight: '900', color: '#8dffa8' });
      t('build towers beside the road · hold out for 15 waves', W / 2, 78, { size: 9, align: 'center', weight: '500' });
      Object.values(TOWERS).forEach((d, i) => { const x = W / 2 - 110 + i * 110; this.drawTower(ctx, { kind: Object.keys(TOWERS)[i] }, x, 112); t(`${d.name} · ${d.cost}g`, x, 126, { size: 8, align: 'center', color: d.color }); });
      t('Bolt zaps fast · Frost slows everything near it · Cannon hits groups', W / 2, 146, { size: 7, align: 'center', weight: '500', color: '#a8c8b0' });
      t('click or tap a tile to build · click a tower to upgrade or sell · 1 2 3 pick, Space next wave, F speed', W / 2, 160, { size: 6, align: 'center', weight: '500', color: '#a8c8b0' });
      if (Math.floor(this.time * 2) % 2 === 0) t('press Space or tap to start', W / 2, 186, { size: 9, align: 'center', color: '#ffe066' });
      if (this.best) t(`best ${this.best}`, W / 2, 204, { size: 8, align: 'center', color: '#8dffa8' });
      return;
    }
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, OY); ctx.fillRect(0, OY + ROWS * T, W, H - OY - ROWS * T);
    t(`♥ ${this.lives}`, 8, 6, { color: '#ff7a8a' });
    t(`${this.money} gold`, 48, 6, { color: '#ffe066' });
    t(`wave ${this.wave}/${WAVES}`, 110, 6);
    if (this.picked) {
      const def = TOWERS[this.picked.kind], up = this.picked.lvl < 2 ? def.up[this.picked.lvl] : null;
      t(`${def.name} lv${this.picked.lvl + 1}`, W - 156, 6, { color: def.color, align: 'right' });
      ctx.fillStyle = up && this.money >= up ? '#2f5a3a' : '#3a3a3a'; ctx.fillRect(W - 148, 2, 70, 16);
      t(up ? `U upgrade ${up}g` : 'max level', W - 113, 6, { size: 7, align: 'center' });
      ctx.fillStyle = '#5a3030'; ctx.fillRect(W - 74, 2, 70, 16);
      t(`S sell +${Math.floor(this.picked.spent * 0.6)}g`, W - 39, 6, { size: 7, align: 'center' });
    } else if (this.state === 'build') t(this.wave === 0 ? 'build, then start the first wave' : `next wave in ${Math.ceil(this.auto)}s`, W - 8, 6, { align: 'right', color: '#a8c8b0' });
    const by = OY + ROWS * T + 2;
    Object.keys(TOWERS).forEach((k, i) => {
      const d = TOWERS[k], x = 8 + i * 80, on = this.sel === k;
      ctx.fillStyle = on ? 'rgba(255,255,255,.15)' : 'rgba(255,255,255,.04)'; ctx.fillRect(x, by, 76, 16);
      this.drawTower(ctx, { kind: k }, x + 10, by + 8, this.money >= d.cost ? 1 : 0.4);
      t(`${d.key} ${d.name} ${d.cost}g`, x + 22, by + 4, { size: 7, color: on ? d.color : '#a8c8b0' });
    });
    ctx.fillStyle = this.state === 'build' ? '#2f6a40' : 'rgba(255,255,255,.08)'; ctx.fillRect(W - 68, by, 64, 16);
    t(this.state === 'build' ? 'NEXT WAVE ▶' : this.fast ? 'SPEED ×2' : 'SPEED ×1', W - 36, by + 4, { size: 7, align: 'center' });
    if (this.banner) t(this.banner.text, W / 2, 110, { size: 12, align: 'center', color: '#ffe066', alpha: Math.min(1, this.banner.t * 2) });
    if (this.state === 'over' || this.state === 'won') {
      ctx.fillStyle = 'rgba(15,26,20,.82)'; ctx.fillRect(0, 70, W, 100);
      t(this.state === 'won' ? 'THE ROAD HOLDS!' : 'THE GATE HAS FALLEN', W / 2, 82, { size: 16, align: 'center', color: this.state === 'won' ? '#8dffa8' : '#ff7a8a' });
      t(`reached wave ${this.wave} · ${this.kills} defeated · score ${this.final}${this.newBest ? ' · new best!' : ''}`, W / 2, 110, { size: 8, align: 'center' });
      if (this.time - this.overAt > 1.2) t('Space or tap to play again', W / 2, 138, { size: 9, align: 'center', color: '#ffe066' });
    }
  }
}

game.start(new Play());
window.towerGuard = game;
</script>
</body>
</html>
