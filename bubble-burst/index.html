<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bubble Burst</title>
<style>html, body { margin: 0; height: 100%; background: #161028; overflow: hidden; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../flint/flint.js"></script>
<script>
'use strict';
// Bubble Burst: shoot bubbles, pop groups of three or more. Built with Flint.
const { Game, Scene, text, store, clamp, pick, rand } = Flint;

const W = 360, H = 240, R = 8, COLS = 11, ROW_H = R * Math.sqrt(3), FW = COLS * R * 2, LEFT = (W - FW) / 2, TOP = 14, DEATH_Y = 200, SX = W / 2, SY = 222;
const COLORS = ['#ff5a7a', '#ffd23f', '#4dd9e8', '#8dffa8', '#b98cff', '#ff9a3d'];
const game = new Game({ canvas: '#game', width: W, height: H, background: '#161028', letterbox: '#161028', touchButtons: [] });
game.input.bind('shoot', ['Space', 'Enter', 'ArrowUp', 'KeyW', 'PadA']);
game.input.bind('swap', ['KeyX', 'ShiftLeft', 'PadB']);

class Play extends Scene {
  enter() { this.state = 'title'; this.best = store.get('bubbleburst:best', 0); this.aim = -Math.PI / 2; this.rows = []; this.falling = []; this.pops = []; }
  begin() {
    this.rows = [];
    this.colorsN = 5;
    for (let i = 0; i < 6; i++) this.addRowTop(true);
    Object.assign(this, { score: 0, shots: 0, misses: 0, shot: null, falling: [], pops: [], state: 'play', combo: 0, level: 1 });
    this.cur = this.randomColor(); this.next = this.randomColor();
    this.audio.sfx('select');
  }
  cols(row) { return row.shifted ? COLS - 1 : COLS; }
  addRowTop(initial) {
    const shifted = this.rows.length ? !this.rows[0].shifted : false;
    const row = { shifted, cells: [] };
    for (let c = 0; c < (shifted ? COLS - 1 : COLS); c++) row.cells.push(initial || Math.random() < 0.9 ? Math.floor(Math.random() * this.colorsN) : -1);
    this.rows.unshift(row);
  }
  pos(r, c) { const row = this.rows[r]; return { x: LEFT + R + c * R * 2 + (row && row.shifted ? R : 0), y: TOP + R + r * ROW_H }; }
  get(r, c) { const row = this.rows[r]; return row && c >= 0 && c < row.cells.length ? row.cells[c] : undefined; }
  neighbors(r, c) {
    const row = this.rows[r], out = [[r, c - 1], [r, c + 1]];
    const d = row.shifted ? [0, 1] : [-1, 0];
    for (const rr of [r - 1, r + 1]) { if (rr < 0) continue; for (const k of d) out.push([rr, c + k]); }
    return out.filter(([rr, cc]) => rr >= 0 && (rr >= this.rows.length || (cc >= 0 && cc < this.rows[rr].cells.length)));
  }
  randomColor() {
    const present = new Set();
    for (const row of this.rows) for (const v of row.cells) if (v >= 0) present.add(v);
    return present.size ? pick([...present]) : Math.floor(Math.random() * this.colorsN);
  }
  ensureRow(r) { while (this.rows.length <= r) { const last = this.rows[this.rows.length - 1]; const shifted = last ? !last.shifted : false; this.rows.push({ shifted, cells: new Array(shifted ? COLS - 1 : COLS).fill(-1) }); } }
  place(x, y, color) {
    // the nearest empty cell to where the bubble stopped
    let best = null, bd = 1e9;
    const r0 = Math.max(0, Math.round((y - TOP - R) / ROW_H) - 1);
    for (let r = r0; r <= r0 + 2; r++) {
      this.ensureRow(r);
      for (let c = 0; c < this.rows[r].cells.length; c++) {
        if (this.rows[r].cells[c] >= 0) continue;
        const p = this.pos(r, c), d = Math.hypot(p.x - x, p.y - y);
        if (d < bd && (r === 0 || this.neighbors(r, c).some(([rr, cc]) => this.get(rr, cc) >= 0))) { bd = d; best = [r, c]; }
      }
    }
    if (!best) { const r = Math.max(0, Math.round((y - TOP - R) / ROW_H)); this.ensureRow(r); best = [r, clamp(Math.round((x - LEFT - R) / (R * 2)), 0, this.rows[r].cells.length - 1)]; }
    const [r, c] = best;
    this.rows[r].cells[c] = color;
    this.resolve(r, c, color);
  }
  resolve(r, c, color) {
    const seen = new Set([r + ',' + c]), group = [[r, c]];
    for (let i = 0; i < group.length; i++) for (const [rr, cc] of this.neighbors(...group[i])) {
      const k = rr + ',' + cc; if (seen.has(k) || this.get(rr, cc) !== color) continue;
      seen.add(k); group.push([rr, cc]);
    }
    if (group.length < 3) {
      this.combo = 0; this.misses++;
      this.audio.tone({ freq: 300, dur: 0.06, type: 'triangle', vol: 0.1 });
      if (this.misses >= Math.max(3, 7 - this.level)) { this.misses = 0; this.addRowTop(false); this.audio.tone({ freq: 140, to: 90, dur: 0.25, type: 'sawtooth', vol: 0.12 }); this.camera.shake(2, 0.2); }
    } else {
      this.combo++;
      for (const [rr, cc] of group) { const p = this.pos(rr, cc); this.pops.push({ x: p.x, y: p.y, color: COLORS[color], t: 0.25 }); this.rows[rr].cells[cc] = -1; this.particles.emit(p.x, p.y, { count: 6, speed: [20, 60], life: [0.2, 0.4], color: COLORS[color], size: [1, 2.5] }); }
      // anything no longer hanging from the top falls off
      const anchored = new Set(), stack = [];
      if (this.rows[0]) this.rows[0].cells.forEach((v, cc) => { if (v >= 0) { anchored.add('0,' + cc); stack.push([0, cc]); } });
      while (stack.length) for (const [rr, cc] of this.neighbors(...stack.pop())) { const k = rr + ',' + cc; if (anchored.has(k) || !(this.get(rr, cc) >= 0)) continue; anchored.add(k); stack.push([rr, cc]); }
      let dropped = 0;
      this.rows.forEach((row, rr) => row.cells.forEach((v, cc) => { if (v >= 0 && !anchored.has(rr + ',' + cc)) { const p = this.pos(rr, cc); this.falling.push({ x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-40, 0), color: v }); row.cells[cc] = -1; dropped++; } }));
      const pts = group.length * 10 * this.combo + dropped * dropped * 20;
      this.score += pts;
      this.banner = { text: dropped ? `+${pts}  ${dropped} dropped!` : `+${pts}`, t: 0.9 };
      this.audio.tone({ freq: 523 * Math.pow(2, Math.min(this.combo, 10) / 12), dur: 0.12, type: 'triangle', vol: 0.12 });
      if (dropped) this.audio.sfx('coin');
    }
    while (this.rows.length && this.rows[this.rows.length - 1].cells.every((v) => v < 0)) this.rows.pop();
    if (!this.rows.length) { // board cleared: next level, one more color
      this.level++; this.colorsN = Math.min(COLORS.length, 4 + this.level); this.score += 1000;
      this.banner = { text: `CLEARED! +1000  ·  LEVEL ${this.level}`, t: 1.6 };
      this.audio.sfx('win');
      for (let i = 0; i < 5 + Math.min(this.level, 3); i++) this.addRowTop(true);
    }
    const lowest = this.rows.length ? TOP + R + (this.rows.length - 1) * ROW_H : 0;
    if (lowest + R > DEATH_Y) return this.gameOver();
  }
  shoot() {
    if (this.shot) return;
    const sp = 330;
    this.shot = { x: SX, y: SY, vx: Math.cos(this.aim) * sp, vy: Math.sin(this.aim) * sp, color: this.cur };
    this.cur = this.next; this.next = this.randomColor();
    this.shots++;
    this.audio.tone({ freq: 660, to: 880, dur: 0.06, type: 'square', vol: 0.06 });
  }
  gameOver() {
    this.state = 'over'; this.overAt = this.time;
    this.audio.sfx('lose');
    this.newBest = this.score > this.best;
    if (this.newBest) { this.best = this.score; store.set('bubbleburst:best', this.best); }
  }
  update(dt) {
    const input = this.input, p = input.pointer;
    if (input.pressed('KeyM')) this.audio.toggleMute();
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    for (const f of this.falling) { f.vy += 500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
    this.falling = (this.falling || []).filter((f) => f.y < H + 20);
    this.pops = (this.pops || []).filter((q) => (q.t -= dt) > 0);
    if (this.state !== 'play') {
      if (this.time > 0.4 && (input.pressed('shoot') || p.pressed) && (this.state === 'title' || this.time - this.overAt > 1)) this.begin();
      return;
    }
    // aiming: mouse/finger, or keys
    const k = input.axis('left', 'right');
    if (k) { this.aim += k * 1.8 * dt; this.kbd = true; }
    if (p.type === 'mouse' && (p.x !== this.lastPx || p.y !== this.lastPy)) { this.kbd = false; this.lastPx = p.x; this.lastPy = p.y; }
    if (!this.kbd && (p.type === 'mouse' || p.down)) this.aim = Math.atan2(Math.min(p.y, SY - 10) - SY, p.x - SX);
    this.aim = clamp(this.aim, -Math.PI + 0.15, -0.15);
    if (input.pressed('shoot') || (p.released && p.type === 'touch') || (p.pressed && p.type === 'mouse' && p.button !== 2)) this.shoot();
    if (input.pressed('swap')) { [this.cur, this.next] = [this.next, this.cur]; this.audio.sfx('blip'); }

    const s = this.shot;
    if (s) {
      const steps = 4;
      for (let i = 0; i < steps && this.shot; i++) {
        s.x += (s.vx * dt) / steps; s.y += (s.vy * dt) / steps;
        if (s.x < LEFT + R) { s.x = LEFT + R; s.vx = Math.abs(s.vx); this.audio.tone({ freq: 400, dur: 0.03, vol: 0.05 }); }
        if (s.x > LEFT + FW - R) { s.x = LEFT + FW - R; s.vx = -Math.abs(s.vx); this.audio.tone({ freq: 400, dur: 0.03, vol: 0.05 }); }
        let hit = s.y < TOP + R;
        if (!hit) for (let r = 0; r < this.rows.length && !hit; r++) this.rows[r].cells.forEach((v, c) => { if (v >= 0 && !hit) { const q = this.pos(r, c); if (Math.hypot(q.x - s.x, q.y - s.y) < R * 1.75) hit = true; } });
        if (hit) { this.shot = null; this.place(s.x, s.y, s.color); }
      }
    }
  }
  bubble(ctx, x, y, color, r = R) {
    const c = COLORS[color];
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, c); g.addColorStop(1, shade(c));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r - 0.4, 0, Math.PI * 2); ctx.fill();
  }
  drawBackground(ctx) {
    ctx.fillStyle = '#161028'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1f1838'; ctx.fillRect(LEFT, 0, FW, H);
    ctx.strokeStyle = 'rgba(255,90,122,.35)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(LEFT, DEATH_Y); ctx.lineTo(LEFT + FW, DEATH_Y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(LEFT - 2, 0, 2, H); ctx.fillRect(LEFT + FW, 0, 2, H);
  }
  drawWorld(ctx) {
    this.rows.forEach((row, r) => row.cells.forEach((v, c) => { if (v >= 0) { const q = this.pos(r, c); this.bubble(ctx, q.x, q.y, v); } }));
    for (const q of this.pops) { ctx.strokeStyle = q.color; ctx.globalAlpha = q.t * 4; ctx.beginPath(); ctx.arc(q.x, q.y, R + (0.25 - q.t) * 30, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
    for (const f of this.falling) this.bubble(ctx, f.x, f.y, f.color);
    if (this.state !== 'play') return;
    // aim guide with one bounce
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    let x = SX, y = SY, vx = Math.cos(this.aim), vy = Math.sin(this.aim);
    for (let i = 0; i < 26; i++) {
      x += vx * 7; y += vy * 7;
      if (x < LEFT + R || x > LEFT + FW - R) { vx = -vx; x = clamp(x, LEFT + R, LEFT + FW - R); }
      if (y < TOP) break;
      ctx.beginPath(); ctx.arc(x, y, 1.1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.save(); ctx.translate(SX, SY); ctx.rotate(this.aim + Math.PI / 2);
    ctx.fillStyle = '#4a3f70'; ctx.fillRect(-4, -18, 8, 14); ctx.restore();
    this.bubble(ctx, SX, SY, this.cur);
    this.bubble(ctx, SX + 30, SY + 8, this.next, R * 0.75);
    if (this.shot) this.bubble(ctx, this.shot.x, this.shot.y, this.shot.color);
  }
  drawUI(ctx) {
    const t = (s, x, y, o) => text(ctx, s, x, y, Object.assign({ size: 8, color: '#f2ecff', weight: '700', font: 'system-ui, -apple-system, "Segoe UI", sans-serif' }, o));
    if (this.state === 'title') {
      ctx.fillStyle = 'rgba(22,16,40,.75)'; ctx.fillRect(0, 0, W, H);
      t('BUBBLE BURST', W / 2, 44, { size: 26, align: 'center', weight: '900', color: '#ff8fd0' });
      t('shoot bubbles · pop groups of three or more of one color', W / 2, 84, { size: 8, align: 'center', weight: '500' });
      t('anything left hanging falls off for big points', W / 2, 98, { size: 8, align: 'center', weight: '500' });
      t('aim with the mouse or ←/→ · click or Space shoots · X swaps', W / 2, 114, { size: 7, align: 'center', weight: '500', color: '#b8acd8' });
      for (let i = 0; i < 6; i++) this.bubble(ctx, W / 2 - 60 + i * 24, 146 + Math.sin(this.time * 3 + i) * 4, i, 9);
      if (Math.floor(this.time * 2) % 2 === 0) t('press Space or tap to start', W / 2, 180, { size: 9, align: 'center', color: '#ffd23f' });
      if (this.best) t(`best ${this.best}`, W / 2, 198, { size: 8, align: 'center', color: '#8dffa8' });
      return;
    }
    t(String(this.score), 10, 8, { size: 11 });
    t(`LEVEL ${this.level}`, 10, 24, { size: 7, color: '#b8acd8' });
    t(`best ${this.best}`, W - 10, 8, { size: 7, align: 'right', color: '#b8acd8' });
    const left = Math.max(3, 7 - this.level) - this.misses;
    t(`row drops in ${left}`, W - 10, 22, { size: 7, align: 'right', color: left <= 1 ? '#ff5a7a' : '#b8acd8' });
    t('next', SX + 30, SY - 8, { size: 6, align: 'center', color: '#b8acd8', weight: '500' });
    if (this.banner) t(this.banner.text, W / 2, 120, { size: 11, align: 'center', color: '#ffd23f', alpha: Math.min(1, this.banner.t * 3) });
    if (this.state === 'over') {
      ctx.fillStyle = 'rgba(22,16,40,.8)'; ctx.fillRect(0, 80, W, 80);
      t('THE BUBBLES REACHED THE LINE', W / 2, 90, { size: 13, align: 'center', color: '#ff5a7a' });
      t(`score ${this.score}${this.newBest ? '  · new best!' : `   best ${this.best}`}`, W / 2, 114, { size: 10, align: 'center' });
      if (this.time - this.overAt > 1) t('Space or tap to play again', W / 2, 136, { size: 9, align: 'center', color: '#ffd23f' });
    }
  }
}
function shade(hex) { const n = parseInt(hex.slice(1), 16), f = 0.55; return `rgb(${((n >> 16) & 255) * f | 0},${((n >> 8) & 255) * f | 0},${(n & 255) * f | 0})`; }

game.start(new Play());
window.bubbleBurst = game;
</script>
</body>
</html>
